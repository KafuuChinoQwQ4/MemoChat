global:
  environment: development
  imagePullSecrets: []
  storageClassName: ""
  domain: memochat.example.com
  clusterDomain: cluster.local
  createNamespaces: true

namespaces:
  prod: memochat-prod
  ops: memochat-ops
  observability: memochat-observability

mesh:
  enabled: false
  provider: istio
  istio:
    injectionLabel: enabled
    mtlsMode: STRICT
    authorizationPolicy:
      enabled: true
      allowedNamespaces: []
    destinationRule:
      enabled: true
      host: ""

externalSecrets:
  enabled: false
  # Set true only after the Vault properties for all four relation tokens have
  # been checked for printable ASCII, >=32 bytes, and pairwise uniqueness.
  relationTokensDistinct: false
  refreshInterval: 1h
  secretStoreRef:
    name: memochat-vault
    kind: ClusterSecretStore
  store:
    create: false
    provider: vault
    vault:
      server: ""
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: memochat-prod
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
  remoteRefs:
    app:
      key: memochat/prod/app
    ops:
      key: memochat/prod/ops
    etcd:
      key: memochat/prod/etcd
    etcdTls:
      key: memochat/prod/etcd-tls

observability:
  enabled: true
  namespace: memochat-observability
  prometheusReleaseName: kube-prometheus-stack
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  podMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  gpu:
    nvidiaEnabled: false

images:
  # Production requires a CI-produced immutable sha-<40 hex> tag.
  releaseRegistry: ghcr.io/kafuuchinoqwq4/memochat
  releaseTag: ""
  gate:
    repository: memochat/gateserver
    tag: local
    pullPolicy: IfNotPresent
  focusedGateways:
    aigateway:
      repository: ghcr.io/kafuuchinoqwq4/memochat/ai-gateway
      tag: local
      pullPolicy: IfNotPresent
    mediagateway:
      repository: ghcr.io/kafuuchinoqwq4/memochat/media-gateway
      tag: local
      pullPolicy: IfNotPresent
    momentsgateway:
      repository: ghcr.io/kafuuchinoqwq4/memochat/moments-gateway
      tag: local
      pullPolicy: IfNotPresent
    callgateway:
      repository: ghcr.io/kafuuchinoqwq4/memochat/call-gateway
      tag: local
      pullPolicy: IfNotPresent
    r18gateway:
      repository: ghcr.io/kafuuchinoqwq4/memochat/r18-gateway
      tag: local
      pullPolicy: IfNotPresent
    register:
      repository: ghcr.io/kafuuchinoqwq4/memochat/register-server
      tag: local
      pullPolicy: IfNotPresent
    login:
      repository: ghcr.io/kafuuchinoqwq4/memochat/login-server
      tag: local
      pullPolicy: IfNotPresent
    account:
      repository: ghcr.io/kafuuchinoqwq4/memochat/account-server
      tag: local
      pullPolicy: IfNotPresent
  chat:
    repository: ghcr.io/kafuuchinoqwq4/memochat/chat-server
    tag: local
    pullPolicy: IfNotPresent
  chatRelationQuery:
    repository: ghcr.io/kafuuchinoqwq4/memochat/chat-relation-query-service
    tag: local
    pullPolicy: IfNotPresent
  chatRelationService:
    repository: ghcr.io/kafuuchinoqwq4/memochat/chat-relation-service-worker
    tag: local
    pullPolicy: IfNotPresent
  aiServer:
    repository: ghcr.io/kafuuchinoqwq4/memochat/ai-server
    tag: local
    pullPolicy: IfNotPresent
  aiOrchestrator:
    repository: memochat/ai-orchestrator
    tag: local
    pullPolicy: IfNotPresent
  varify:
    repository: ghcr.io/kafuuchinoqwq4/memochat/varify-server
    tag: local
    pullPolicy: IfNotPresent
  memoOps:
    repository: memochat/memo-ops
    tag: local
    pullPolicy: IfNotPresent
  envoy:
    repository: envoyproxy/envoy
    tag: v1.38.0
    digest: sha256:8146b97ee61a42cd216514709e4e3198af75f014974e3d9f310aef9c901fcbdf
    pullPolicy: IfNotPresent
  otelCollector:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.99.0
    digest: sha256:b65527791431d76d058b2813748a3f4a8912540d7b23beac2f6b4e02c872f5b7
    pullPolicy: IfNotPresent

externalServices:
  postgres:
    host: postgres.example.internal
    port: 5432
    user: memochat
    password: ""
    database: memo_pg
    schema: memo
    sslMode: verify-full
    roles:
      chat: memo_chat_app
      media: memo_media_app
      moments: memo_moments_app
      call: memo_call_app
      account: memo_account_app
    rolePasswords:
      chat: ""
      media: ""
      moments: ""
      call: ""
      account: ""
  redis:
    host: redis.example.internal
    port: 6379
    password: ""
  mongodb:
    uri: ""
    database: memochat
  kafka:
    brokers: kafka.example.internal:9092
  rabbitmq:
    host: rabbitmq.example.internal
    port: 5672
    username: memochat
    password: ""
    vhost: /
  mysql:
    host: mysql.example.internal
    port: 3306
    password: ""
    schema: memo
  smtp:
    host: smtp.example.internal
    port: 465
    secure: true
    user: noreply@example.com
    pass: ""
    from: noreply@example.com
  livekit:
    url: wss://livekit.example.com
    apiKey: ""
    apiSecret: ""

gate:
  replicaCount: 2
  service:
    port: 8080
  ingress:
    enabled: false
    className: envoy
    annotations: {}
    tls: []
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  resources: {}
  env: {}
  media:
    provider: local
    rootPath: /data/uploads
    publicBaseUrl: ""
    maxImageMB: 200
    maxFileMB: 20480
    chunkSizeKB: 4096
    sessionExpireSec: 86400

legacyGate:
  enabled: false

focusedGateways:
  enabled: true
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  resources: {}
  env: {}
  services:
    aigateway:
      enabled: true
      serviceName: aigateway
      target: AIGatewayServer
      configKey: aigateway.ini
      configSection: AIGateway
      port: 8093
      replicaCount: 2
    mediagateway:
      enabled: true
      serviceName: mediagateway
      target: MediaGatewayServer
      configKey: mediagateway.ini
      configSection: MediaGateway
      port: 8094
      replicaCount: 2
    momentsgateway:
      enabled: true
      serviceName: momentsgateway
      target: MomentsGatewayServer
      configKey: momentsgateway.ini
      configSection: MomentsGateway
      port: 8099
      replicaCount: 2
    callgateway:
      enabled: true
      serviceName: callgateway
      target: CallGatewayServer
      configKey: callgateway.ini
      configSection: CallGateway
      port: 8097
      replicaCount: 2
    r18gateway:
      enabled: true
      serviceName: r18gateway
      target: R18GatewayServer
      configKey: r18gateway.ini
      configSection: R18Gateway
      port: 8098
      replicaCount: 2
      allowedImageHosts: "storage-b.picacomic.com,img.picacomic.com"
      persistence:
        enabled: true
        existingClaim: ""
        accessModes:
          - ReadWriteMany
        size: 1Gi
        storageClassName: ""
    register:
      enabled: true
      serviceName: register
      target: RegisterServer
      configKey: register.ini
      configSection: Register
      port: 8101
      replicaCount: 2
    login:
      enabled: true
      serviceName: login
      target: LoginServer
      configKey: login.ini
      configSection: Login
      port: 8102
      replicaCount: 2
    account:
      enabled: true
      serviceName: account
      target: AccountServer
      configKey: account.ini
      configSection: Account
      port: 8103
      replicaCount: 2

chat:
  replicaCount: 1
  serviceName: chatserver
  tcpPort: 8090
  rpcPort: 50055
  exposeTcpLoadBalancer: false
  tcpLoadBalancerAnnotations: {}
  pdb:
    enabled: true
    minAvailable: 1
  resources: {}
  env: {}
  relationQuery:
    enabled: true
    replicaCount: 1
    serviceName: chat-relation-query
    configKey: chatrelationquery.ini
    grpcPort: 50090
    resources: {}
    env: {}
  relationService:
    enabled: true
    replicaCount: 1
    serviceName: chat-relation-service
    configKey: chatrelationservice.ini
    grpcPort: 50091
    resources: {}
    env: {}

aiServer:
  enabled: true
  replicaCount: 2
  serviceName: aiserver
  service:
    grpcPort: 8095
  resources: {}
  env: {}

aiOrchestrator:
  enabled: true
  replicaCount: 2
  serviceName: ai-orchestrator
  service:
    port: 8096
  resources: {}
  env: {}
  dependencies:
    ollamaHost: ollama.example.internal
    ollamaPort: 11434
    ollamaEnabled: false
    qdrantHost: qdrant.example.internal
    qdrantPort: 6333
    qdrantGrpcPort: 6334
    neo4jHost: neo4j.example.internal
    neo4jPort: 7687
    neo4jPassword: ""
    neo4jEnabled: false

varify:
  replicaCount: 1
  service:
    grpcPort: 50051
    healthPort: 8081
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 70
  resources: {}
  env: {}

memoOps:
  enabled: true
  server:
    replicaCount: 1
    service:
      port: 9000
    resources: {}
  collector:
    replicaCount: 1
    metricsPort: 9108
    resources: {}

otelCollector:
  replicaCount: 1
  service:
    grpcPort: 4317
    httpPort: 4318
    zipkinPort: 9411
    metricsPort: 8888
  resources: {}

jobs:
  postgresMigrate:
    enabled: true
    image: postgres@sha256:78df81b1442dcc764c1104154da7162635e40cfffe67579c42a1c1b96dfc209c
  kafkaInit:
    enabled: true
    image: python@sha256:46cb7cc2877e60fbd5e21a9ae6115c30ace7a077b9f8772da879e4590c18c2e3
  rabbitmqInit:
    enabled: true
    image: python@sha256:46cb7cc2877e60fbd5e21a9ae6115c30ace7a077b9f8772da879e4590c18c2e3

envoy:
  tls:
    secretName: ""

secrets:
  chatAuthSecret: ""
  jwtAccessSecret: ""
  authRefreshPepper: ""
  relationCommandAuthToken: ""
  relationChatQueryAuthToken: ""
  relationCallAuthToken: ""
  relationMomentsAuthToken: ""
  livekitApiKey: ""
  livekitApiSecret: ""
  minioAccessKey: ""
  minioSecretKey: ""
  aiInternalApiKey: ""
  aiProviderAdminKey: ""
  r18PicacgApiKey: ""
  r18PicacgHmacKey: ""
  r18SourceAdminKey: ""
  r18CredentialMasterKey: ""
