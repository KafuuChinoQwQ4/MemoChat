apiVersion: apps/v1
kind: Deployment
metadata:
  name: varifyserver
  namespace: {{ .Values.namespaces.prod }}
  labels:
    app.kubernetes.io/component: varifyserver
    {{- include "memochat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.varify.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: varifyserver
      {{- include "memochat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: varifyserver
        {{- include "memochat.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "memochat.podSecurityContext" . | nindent 8 }}
      containers:
        - name: varifyserver
          image: {{ include "memochat.image" (dict "root" . "image" .Values.images.varify) | quote }}
          imagePullPolicy: {{ .Values.images.varify.pullPolicy }}
          securityContext:
            {{- include "memochat.containerSecurityContext" $ | nindent 12 }}
          env:
            - name: CONFIG_PATH
              value: /app/config.ini
            - name: MEMOCHAT_REDIS_PASSWD
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: redis-password } }
            - name: MEMOCHAT_RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: rabbitmq-password } }
            - name: MEMOCHAT_RABBITMQ_USERNAME
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: rabbitmq-username } }
            - name: MEMOCHAT_EMAIL_SMTPPASS
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: smtp-pass } }
            - name: MEMOCHAT_EMAIL_SMTPUSER
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: smtp-user } }
            - name: MEMOCHAT_EMAIL_FROM
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: smtp-from } }
            - name: REQUIRED_ENV_VARS
              value: MEMOCHAT_REDIS_PASSWD MEMOCHAT_RABBITMQ_USERNAME MEMOCHAT_RABBITMQ_PASSWORD MEMOCHAT_EMAIL_SMTPUSER MEMOCHAT_EMAIL_SMTPPASS MEMOCHAT_EMAIL_FROM
            - name: MEMOCHAT_VARIFYSERVER_PORT
              value: {{ .Values.varify.service.grpcPort | quote }}
            - name: MEMOCHAT_HEALTH_PORT
              value: {{ .Values.varify.service.healthPort | quote }}
          ports:
            - name: grpc
              containerPort: {{ .Values.varify.service.grpcPort }}
            - name: health
              containerPort: {{ .Values.varify.service.healthPort }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/memochat
            - name: config
              mountPath: /app/config.ini
              subPath: varify.ini
          livenessProbe:
            httpGet: { path: /healthz, port: health }
          readinessProbe:
            httpGet: { path: /readyz, port: health }
          startupProbe:
            httpGet: { path: /healthz, port: health }
            failureThreshold: 30
            periodSeconds: 5
          resources:
            {{- toYaml .Values.varify.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: config
          configMap:
            name: memochat-config
---
apiVersion: v1
kind: Service
metadata:
  name: varifyserver
  namespace: {{ .Values.namespaces.prod }}
spec:
  selector:
    app.kubernetes.io/component: varifyserver
    {{- include "memochat.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.varify.service.grpcPort }}
      targetPort: grpc
    - name: health
      port: {{ .Values.varify.service.healthPort }}
      targetPort: health
