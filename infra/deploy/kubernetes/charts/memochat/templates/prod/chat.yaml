{{- if .Values.chat.relationQuery.enabled }}
{{- if not .Values.mesh.enabled }}
{{- fail "chat.relationQuery.enabled=true requires mesh.enabled=true because relation gRPC bearer tokens require mTLS" }}
{{- end }}
{{- if ne .Values.mesh.provider "istio" }}
{{- fail "chat.relationQuery.enabled=true requires mesh.provider=istio" }}
{{- end }}
{{- if ne (upper (trim (toString .Values.mesh.istio.mtlsMode))) "STRICT" }}
{{- fail "chat.relationQuery.enabled=true requires mesh.istio.mtlsMode=STRICT" }}
{{- end }}
{{- end }}
{{- if .Values.chat.relationService.enabled }}
{{- if not .Values.mesh.enabled }}
{{- fail "chat.relationService.enabled=true requires mesh.enabled=true because relation gRPC bearer tokens require mTLS" }}
{{- end }}
{{- if ne .Values.mesh.provider "istio" }}
{{- fail "chat.relationService.enabled=true requires mesh.provider=istio" }}
{{- end }}
{{- if ne (upper (trim (toString .Values.mesh.istio.mtlsMode))) "STRICT" }}
{{- fail "chat.relationService.enabled=true requires mesh.istio.mtlsMode=STRICT" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.chat.serviceName }}
  namespace: {{ .Values.namespaces.prod }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: chatserver
    {{- include "memochat.selectorLabels" . | nindent 4 }}
  ports:
    - name: tcp
      port: {{ .Values.chat.tcpPort }}
      targetPort: tcp
    - name: grpc
      port: {{ .Values.chat.rpcPort }}
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.chat.serviceName }}
  namespace: {{ .Values.namespaces.prod }}
  labels:
    app.kubernetes.io/component: chatserver
    {{- include "memochat.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.chat.serviceName }}
  replicas: {{ .Values.chat.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: chatserver
      {{- include "memochat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: chatserver
        {{- include "memochat.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if and .Values.mesh.enabled (eq .Values.mesh.provider "istio") }}
        sidecar.istio.io/inject: "true"
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "memochat.podSecurityContext" . | nindent 8 }}
      containers:
        - name: chatserver
          image: {{ include "memochat.image" (dict "root" . "image" .Values.images.chat) | quote }}
          imagePullPolicy: {{ .Values.images.chat.pullPolicy }}
          securityContext:
            {{- include "memochat.containerSecurityContext" $ | nindent 12 }}
          env:
            - name: MEMOCHAT_ENV
              value: production
            - name: MEMOCHAT_REQUIRE_PROD_SECRETS
              value: "1"
            - name: MEMOCHAT_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: MEMOCHAT_INSTANCE_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: RUN_WITH_CONFIG_ARG
              value: "true"
            - name: CONFIG_PATH
              value: /app/config/config.ini
            - name: MEMOCHAT_POSTGRES_PASSWD
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: postgres-chat-password } }
            - name: MEMOCHAT_ACCOUNTPOSTGRES_PASSWD
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: postgres-account-password } }
            - name: MEMOCHAT_REDIS_PASSWD
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: redis-password } }
            - name: MEMOCHAT_MONGO_URI
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: mongodb-uri } }
            - name: MEMOCHAT_CHATAUTH_HMACSECRET
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: chat-auth-secret } }
            {{- if .Values.chat.relationService.enabled }}
            - name: MEMOCHAT_RELATIONSERVICE_AUTHTOKEN
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: relation-command-auth-token } }
            {{- end }}
            - name: MEMOCHAT_RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: rabbitmq-password } }
            - name: MEMOCHAT_RABBITMQ_USERNAME
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: rabbitmq-username } }
            {{- if .Values.chat.relationQuery.enabled }}
            - name: MEMOCHAT_RELATIONQUERYSERVICE_CHATAUTHTOKEN
              valueFrom: { secretKeyRef: { name: memochat-secrets, key: relation-chat-query-auth-token } }
            {{- end }}
            - name: REQUIRED_ENV_VARS
              value: "MEMOCHAT_POSTGRES_PASSWD MEMOCHAT_ACCOUNTPOSTGRES_PASSWD MEMOCHAT_REDIS_PASSWD MEMOCHAT_MONGO_URI MEMOCHAT_CHATAUTH_HMACSECRET MEMOCHAT_RABBITMQ_USERNAME MEMOCHAT_RABBITMQ_PASSWORD{{ if .Values.chat.relationService.enabled }} MEMOCHAT_RELATIONSERVICE_AUTHTOKEN{{ end }}{{ if .Values.chat.relationQuery.enabled }} MEMOCHAT_RELATIONQUERYSERVICE_CHATAUTHTOKEN{{ end }}"
          ports:
            - name: tcp
              containerPort: {{ .Values.chat.tcpPort }}
            - name: grpc
              containerPort: {{ .Values.chat.rpcPort }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/memochat
            - name: config
              mountPath: /app/config/config.ini
              subPath: chat.ini
          livenessProbe:
            tcpSocket: { port: grpc }
          readinessProbe:
            tcpSocket: { port: grpc }
          startupProbe:
            tcpSocket: { port: grpc }
            failureThreshold: 30
            periodSeconds: 5
          resources:
            {{- toYaml .Values.chat.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: config
          configMap:
            name: memochat-config
---
{{- if .Values.chat.exposeTcpLoadBalancer }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.chat.serviceName }}-tcp
  namespace: {{ .Values.namespaces.prod }}
  annotations:
    {{- toYaml .Values.chat.tcpLoadBalancerAnnotations | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/component: chatserver
    {{- include "memochat.selectorLabels" . | nindent 4 }}
  ports:
    - name: tcp
      port: {{ .Values.chat.tcpPort }}
      targetPort: tcp
{{- end }}
{{- if .Values.chat.relationService.enabled }}
---
