{{- include "memochat.validateProductionImages" . }}
{{- if not .Values.externalSecrets.enabled }}
{{- $secretChecks := dict
  "externalServices.postgres.password" .Values.externalServices.postgres.password
  "externalServices.postgres.rolePasswords.chat" .Values.externalServices.postgres.rolePasswords.chat
  "externalServices.postgres.rolePasswords.media" .Values.externalServices.postgres.rolePasswords.media
  "externalServices.postgres.rolePasswords.moments" .Values.externalServices.postgres.rolePasswords.moments
  "externalServices.postgres.rolePasswords.call" .Values.externalServices.postgres.rolePasswords.call
  "externalServices.postgres.rolePasswords.account" .Values.externalServices.postgres.rolePasswords.account
  "externalServices.redis.password" .Values.externalServices.redis.password
  "externalServices.mongodb.uri" .Values.externalServices.mongodb.uri
  "externalServices.rabbitmq.username" .Values.externalServices.rabbitmq.username
  "externalServices.rabbitmq.password" .Values.externalServices.rabbitmq.password
  "externalServices.mysql.password" .Values.externalServices.mysql.password
  "externalServices.smtp.pass" .Values.externalServices.smtp.pass
  "externalServices.smtp.user" .Values.externalServices.smtp.user
  "externalServices.smtp.from" .Values.externalServices.smtp.from
  "externalServices.livekit.apiKey" .Values.externalServices.livekit.apiKey
  "externalServices.livekit.apiSecret" .Values.externalServices.livekit.apiSecret
  "aiOrchestrator.dependencies.neo4jPassword" .Values.aiOrchestrator.dependencies.neo4jPassword
  "secrets.chatAuthSecret" .Values.secrets.chatAuthSecret
  "secrets.jwtAccessSecret" .Values.secrets.jwtAccessSecret
  "secrets.authRefreshPepper" .Values.secrets.authRefreshPepper
  "secrets.relationCommandAuthToken" .Values.secrets.relationCommandAuthToken
  "secrets.relationChatQueryAuthToken" .Values.secrets.relationChatQueryAuthToken
  "secrets.relationCallAuthToken" .Values.secrets.relationCallAuthToken
  "secrets.relationMomentsAuthToken" .Values.secrets.relationMomentsAuthToken
  "secrets.livekitApiKey" .Values.secrets.livekitApiKey
  "secrets.livekitApiSecret" .Values.secrets.livekitApiSecret
  "secrets.minioAccessKey" .Values.secrets.minioAccessKey
  "secrets.minioSecretKey" .Values.secrets.minioSecretKey
  "secrets.aiInternalApiKey" .Values.secrets.aiInternalApiKey
  "secrets.aiProviderAdminKey" .Values.secrets.aiProviderAdminKey
  "secrets.r18PicacgApiKey" .Values.secrets.r18PicacgApiKey
  "secrets.r18PicacgHmacKey" .Values.secrets.r18PicacgHmacKey
  "secrets.r18SourceAdminKey" .Values.secrets.r18SourceAdminKey
  "secrets.r18CredentialMasterKey" .Values.secrets.r18CredentialMasterKey
-}}
{{- range $name, $raw := $secretChecks }}
{{- $value := required (printf "%s is required" $name) $raw }}
{{- $normalized := lower (trim (toString $value)) }}
{{- if or (eq $normalized "") (eq $normalized "change-me") (eq $normalized "guest") (eq $normalized "password") (eq $normalized "123456") }}
{{- fail (printf "%s must be overridden with a production secret" $name) }}
{{- end }}
{{- end }}
{{- $r18CredentialMasterKey := required "secrets.r18CredentialMasterKey is required" .Values.secrets.r18CredentialMasterKey | toString }}
{{- if not (regexMatch "^[0-9A-Fa-f]{64}$" $r18CredentialMasterKey) }}
{{- fail "secrets.r18CredentialMasterKey must contain exactly 64 hexadecimal characters" }}
{{- end }}
{{- $postgresPasswordOwners := dict }}
{{- range $name, $raw := dict
  "externalServices.postgres.password" .Values.externalServices.postgres.password
  "externalServices.postgres.rolePasswords.chat" .Values.externalServices.postgres.rolePasswords.chat
  "externalServices.postgres.rolePasswords.media" .Values.externalServices.postgres.rolePasswords.media
  "externalServices.postgres.rolePasswords.moments" .Values.externalServices.postgres.rolePasswords.moments
  "externalServices.postgres.rolePasswords.call" .Values.externalServices.postgres.rolePasswords.call
  "externalServices.postgres.rolePasswords.account" .Values.externalServices.postgres.rolePasswords.account
}}
{{- $password := required (printf "%s is required" $name) $raw | toString }}
{{- if lt (len $password) 16 }}
{{- fail (printf "%s must contain at least 16 bytes" $name) }}
{{- end }}
{{- if hasKey $postgresPasswordOwners $password }}
{{- fail (printf "%s must not reuse another PostgreSQL role password" $name) }}
{{- end }}
{{- $_ := set $postgresPasswordOwners $password $name }}
{{- end }}
{{- $relationCommandAuthToken := required "secrets.relationCommandAuthToken is required" .Values.secrets.relationCommandAuthToken | toString }}
{{- $relationChatQueryAuthToken := required "secrets.relationChatQueryAuthToken is required" .Values.secrets.relationChatQueryAuthToken | toString }}
{{- $relationCallAuthToken := required "secrets.relationCallAuthToken is required" .Values.secrets.relationCallAuthToken | toString }}
{{- $relationMomentsAuthToken := required "secrets.relationMomentsAuthToken is required" .Values.secrets.relationMomentsAuthToken | toString }}
{{- range $name, $value := dict
  "secrets.relationCommandAuthToken" $relationCommandAuthToken
  "secrets.relationChatQueryAuthToken" $relationChatQueryAuthToken
  "secrets.relationCallAuthToken" $relationCallAuthToken
  "secrets.relationMomentsAuthToken" $relationMomentsAuthToken
}}
{{- if lt (len $value) 32 }}
{{- fail (printf "%s must contain at least 32 bytes" $name) }}
{{- end }}
{{- if not (regexMatch "^[!-~]+$" $value) }}
{{- fail (printf "%s must contain only printable ASCII bytes" $name) }}
{{- end }}
{{- end }}
{{- if or
  (eq $relationCommandAuthToken $relationChatQueryAuthToken)
  (eq $relationCommandAuthToken $relationCallAuthToken)
  (eq $relationCommandAuthToken $relationMomentsAuthToken)
  (eq $relationChatQueryAuthToken $relationCallAuthToken)
  (eq $relationChatQueryAuthToken $relationMomentsAuthToken)
  (eq $relationCallAuthToken $relationMomentsAuthToken)
}}
{{- fail "relation command, Chat query, Call query, and Moments query auth tokens must be distinct" }}
{{- end }}
{{- if eq (lower (trim (toString .Values.externalServices.postgres.sslMode))) "disable" }}
{{- fail "externalServices.postgres.sslMode must not be disable in the production Helm chart" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: memochat-secrets
  namespace: {{ .Values.namespaces.prod }}
  labels:
    {{- include "memochat.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "externalServices.postgres.password is required" .Values.externalServices.postgres.password | quote }}
  postgres-chat-password: {{ required "externalServices.postgres.rolePasswords.chat is required" .Values.externalServices.postgres.rolePasswords.chat | quote }}
  postgres-media-password: {{ required "externalServices.postgres.rolePasswords.media is required" .Values.externalServices.postgres.rolePasswords.media | quote }}
  postgres-moments-password: {{ required "externalServices.postgres.rolePasswords.moments is required" .Values.externalServices.postgres.rolePasswords.moments | quote }}
  postgres-call-password: {{ required "externalServices.postgres.rolePasswords.call is required" .Values.externalServices.postgres.rolePasswords.call | quote }}
  postgres-account-password: {{ required "externalServices.postgres.rolePasswords.account is required" .Values.externalServices.postgres.rolePasswords.account | quote }}
  redis-password: {{ required "externalServices.redis.password is required" .Values.externalServices.redis.password | quote }}
  mongodb-uri: {{ required "externalServices.mongodb.uri is required" .Values.externalServices.mongodb.uri | quote }}
  rabbitmq-username: {{ required "externalServices.rabbitmq.username is required" .Values.externalServices.rabbitmq.username | quote }}
  rabbitmq-password: {{ required "externalServices.rabbitmq.password is required" .Values.externalServices.rabbitmq.password | quote }}
  neo4j-password: {{ required "aiOrchestrator.dependencies.neo4jPassword is required" .Values.aiOrchestrator.dependencies.neo4jPassword | quote }}
  mysql-password: {{ required "externalServices.mysql.password is required" .Values.externalServices.mysql.password | quote }}
  smtp-pass: {{ required "externalServices.smtp.pass is required" .Values.externalServices.smtp.pass | quote }}
  smtp-user: {{ required "externalServices.smtp.user is required" .Values.externalServices.smtp.user | quote }}
  smtp-from: {{ required "externalServices.smtp.from is required" .Values.externalServices.smtp.from | quote }}
  chat-auth-secret: {{ required "secrets.chatAuthSecret is required" .Values.secrets.chatAuthSecret | quote }}
  jwt-access-secret: {{ required "secrets.jwtAccessSecret is required" .Values.secrets.jwtAccessSecret | quote }}
  auth-refresh-pepper: {{ required "secrets.authRefreshPepper is required" .Values.secrets.authRefreshPepper | quote }}
  relation-command-auth-token: {{ required "secrets.relationCommandAuthToken is required" .Values.secrets.relationCommandAuthToken | quote }}
  relation-chat-query-auth-token: {{ required "secrets.relationChatQueryAuthToken is required" .Values.secrets.relationChatQueryAuthToken | quote }}
  relation-call-auth-token: {{ required "secrets.relationCallAuthToken is required" .Values.secrets.relationCallAuthToken | quote }}
  relation-moments-auth-token: {{ required "secrets.relationMomentsAuthToken is required" .Values.secrets.relationMomentsAuthToken | quote }}
  livekit-api-key: {{ required "secrets.livekitApiKey is required" .Values.secrets.livekitApiKey | quote }}
  livekit-api-secret: {{ required "secrets.livekitApiSecret is required" .Values.secrets.livekitApiSecret | quote }}
  minio-access-key: {{ required "secrets.minioAccessKey is required" .Values.secrets.minioAccessKey | quote }}
  minio-secret-key: {{ required "secrets.minioSecretKey is required" .Values.secrets.minioSecretKey | quote }}
  ai-internal-api-key: {{ required "secrets.aiInternalApiKey is required" .Values.secrets.aiInternalApiKey | quote }}
  ai-provider-admin-key: {{ required "secrets.aiProviderAdminKey is required" .Values.secrets.aiProviderAdminKey | quote }}
  r18-picacg-api-key: {{ required "secrets.r18PicacgApiKey is required" .Values.secrets.r18PicacgApiKey | quote }}
  r18-picacg-hmac-key: {{ required "secrets.r18PicacgHmacKey is required" .Values.secrets.r18PicacgHmacKey | quote }}
  r18-source-admin-key: {{ required "secrets.r18SourceAdminKey is required" .Values.secrets.r18SourceAdminKey | quote }}
  r18-credential-master-key: {{ required "secrets.r18CredentialMasterKey is required" .Values.secrets.r18CredentialMasterKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: memochat-ops-secrets
  namespace: {{ .Values.namespaces.ops }}
  labels:
    {{- include "memochat.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "externalServices.postgres.password is required" .Values.externalServices.postgres.password | quote }}
  redis-password: {{ required "externalServices.redis.password is required" .Values.externalServices.redis.password | quote }}
  mysql-password: {{ required "externalServices.mysql.password is required" .Values.externalServices.mysql.password | quote }}
{{- end }}
