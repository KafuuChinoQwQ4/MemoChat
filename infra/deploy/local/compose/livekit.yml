services:
  memochat-livekit:
    image: livekit/livekit-server@sha256:2c6869d2d5ff6c9c0166f47be1c92dad6928bfecfa5e4060a6ece48db8accfa3
    container_name: memochat-livekit
    profiles:
      - calls
    restart: unless-stopped
    user: ${MEMOCHAT_RUNTIME_UID:?set MEMOCHAT_RUNTIME_UID}:${MEMOCHAT_RUNTIME_GID:?set MEMOCHAT_RUNTIME_GID}
    read_only: true
    command: []
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 0.0.0.0
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
        keys:
          ${MEMOCHAT_LIVEKIT_API_KEY:-}: ${MEMOCHAT_LIVEKIT_API_SECRET:-}
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "127.0.0.1:7881:7881/tcp"
      - "127.0.0.1:7882:7882/udp"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=${MEMOCHAT_RUNTIME_UID:?set MEMOCHAT_RUNTIME_UID},gid=${MEMOCHAT_RUNTIME_GID:?set MEMOCHAT_RUNTIME_GID},mode=0700
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -T 3 -O - http://127.0.0.1:7880/ | grep -Fxq OK"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
