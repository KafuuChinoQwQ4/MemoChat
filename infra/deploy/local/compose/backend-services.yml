x-backend-environment: &backend-environment
  MEMOCHAT_RELEASE_MODE: "1"
  MEMOCHAT_ALLOW_DEV_SECRETS: "0"
  MEMOCHAT_LOG_TOCONSOLE: "true"
  MEMOCHAT_LOG_DIR: /tmp/memochat-logs
  MEMOCHAT_LOG_REDACT: "true"
  MEMOCHAT_LOG_ENV: release
  MEMOCHAT_TELEMETRY_OTLPENDPOINT: http://memochat-otel-collector:9411/api/v2/spans
  MEMOCHAT_REDIS_HOST: memochat-redis
  MEMOCHAT_REDIS_PORT: "6379"
  MEMOCHAT_POSTGRES_HOST: memochat-postgres
  MEMOCHAT_POSTGRES_PORT: "5432"
  MEMOCHAT_ACCOUNTPOSTGRES_HOST: memochat-postgres
  MEMOCHAT_ACCOUNTPOSTGRES_PORT: "5432"
  MEMOCHAT_RABBITMQ_HOST: memochat-rabbitmq
  MEMOCHAT_RABBITMQ_PORT: "5672"
  MEMOCHAT_RABBITMQ_USERNAME: ${MEMOCHAT_RABBITMQ_USER:?set MEMOCHAT_RABBITMQ_USER}
  MEMOCHAT_KAFKA_BROKERS: memochat-redpanda:9092
  MEMOCHAT_VARIFYSERVER_HOST: 127.0.0.1
  MEMOCHAT_VARIFYSERVER_PORT: "50051"
  MEMOCHAT_RELATIONSERVICE_ENDPOINT: 127.0.0.1:50091
  MEMOCHAT_RELATIONQUERYSERVICE_ENDPOINT: 127.0.0.1:50090
  MEMOCHAT_MESSAGESERVICE_ENDPOINT: 127.0.0.1:50092
  MEMOCHAT_CHATSERVER1_TCPHOST: 127.0.0.1
  MEMOCHAT_CHATSERVER1_QUICHOST: 127.0.0.1
  MEMOCHAT_CHATSERVER1_RPCHOST: 127.0.0.1
  MEMOCHAT_AISERVER_HOST: 127.0.0.1

x-backend-depends-on: &backend-depends-on
  memochat-envoy-gateway:
    condition: service_started
  memochat-redis:
    condition: service_started
  memochat-postgres:
    condition: service_started
  memochat-mongo:
    condition: service_started
  memochat-rabbitmq:
    condition: service_started
  memochat-redpanda:
    condition: service_started
  memochat-chat-tls-init:
    condition: service_completed_successfully

x-backend-service: &backend-service
  restart: unless-stopped
  init: true
  user: ${MEMOCHAT_RUNTIME_UID:?set MEMOCHAT_RUNTIME_UID}:${MEMOCHAT_RUNTIME_GID:?set MEMOCHAT_RUNTIME_GID}
  read_only: true
  network_mode: service:memochat-envoy-gateway
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  depends_on: *backend-depends-on

x-observability-service: &observability-service
  user: ${MEMOCHAT_RUNTIME_UID:?set MEMOCHAT_RUNTIME_UID}:${MEMOCHAT_RUNTIME_GID:?set MEMOCHAT_RUNTIME_GID}
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=${MEMOCHAT_RUNTIME_UID:?set MEMOCHAT_RUNTIME_UID},gid=${MEMOCHAT_RUNTIME_GID:?set MEMOCHAT_RUNTIME_GID},mode=0700

services:
  # The release stack uses preflight-validated host certificates. Keep the base
  # development certgen dependency as a no-op so an empty data root never relies
  # on openssl being present in the Envoy runtime image.
  memochat-envoy-certgen:
    image: envoyproxy/envoy@sha256:8146b97ee61a42cd216514709e4e3198af75f014974e3d9f310aef9c901fcbdf
    entrypoint:
      - /bin/true
    command: !override []
    volumes: !override []

  memochat-chat-tls-init:
    image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    restart: "no"
    network_mode: none
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        umask 077
        cp /source/server.crt /target/server.crt
        cp /source/server.key /target/server.key
        cp /source/server.crt /target/servercert.pem
        cp /source/server.key /target/serverkey.pem
        chown "${MEMOCHAT_RUNTIME_UID:?set MEMOCHAT_RUNTIME_UID}:${MEMOCHAT_RUNTIME_GID:?set MEMOCHAT_RUNTIME_GID}" \
          /target/server.crt /target/server.key /target/servercert.pem /target/serverkey.pem
        chmod 0444 /target/server.crt /target/servercert.pem
        chmod 0400 /target/server.key /target/serverkey.pem
    volumes:
      - type: bind
        source: ${MEMOCHAT_TLS_CERT_FILE:?set MEMOCHAT_TLS_CERT_FILE}
        target: /source/server.crt
        read_only: true
      - type: bind
        source: ${MEMOCHAT_TLS_KEY_FILE:?set MEMOCHAT_TLS_KEY_FILE}
        target: /source/server.key
        read_only: true
      - type: volume
        source: memochat-chat-tls
        target: /target

  memochat-release-provision-postgres:
    image: postgres@sha256:78df81b1442dcc764c1104154da7162635e40cfffe67579c42a1c1b96dfc209c
    profiles:
      - provision
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      MEMOCHAT_POSTGRES_USER: ${MEMOCHAT_POSTGRES_USER:?set MEMOCHAT_POSTGRES_USER}
      MEMOCHAT_POSTGRES_DATABASE: ${MEMOCHAT_POSTGRES_DATABASE:?set MEMOCHAT_POSTGRES_DATABASE}
      MEMOCHAT_POSTGRES_PASSWORD: ${MEMOCHAT_POSTGRES_PASSWORD:?set MEMOCHAT_POSTGRES_PASSWORD}
      MEMOCHAT_CHAT_POSTGRES_PASSWORD: ${MEMOCHAT_CHAT_POSTGRES_PASSWORD:?set MEMOCHAT_CHAT_POSTGRES_PASSWORD}
      MEMOCHAT_ACCOUNT_POSTGRES_PASSWORD: ${MEMOCHAT_ACCOUNT_POSTGRES_PASSWORD:?set MEMOCHAT_ACCOUNT_POSTGRES_PASSWORD}
      MEMOCHAT_MEDIA_POSTGRES_PASSWORD: ${MEMOCHAT_MEDIA_POSTGRES_PASSWORD:?set MEMOCHAT_MEDIA_POSTGRES_PASSWORD}
      MEMOCHAT_MOMENTS_POSTGRES_PASSWORD: ${MEMOCHAT_MOMENTS_POSTGRES_PASSWORD:?set MEMOCHAT_MOMENTS_POSTGRES_PASSWORD}
      MEMOCHAT_CALL_POSTGRES_PASSWORD: ${MEMOCHAT_CALL_POSTGRES_PASSWORD:-}
      MEMOCHAT_PROVISION_CALLS: ${COMPOSE_MEMOCHAT_ENABLE_CALLS:-0}
    entrypoint:
      - /bin/sh
      - /provision/postgres.sh
    volumes:
      - ./provision:/provision:ro
      - ../../../apps/server/migrations/postgresql/business:/migrations:ro
    depends_on:
      memochat-postgres:
        condition: service_started

  memochat-release-provision-mongo:
    image: mongo@sha256:adfc10cca964f99224ac4948e782c260c4c87e71958df334e8ca882ff85062ea
    profiles:
      - provision
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    environment:
      MEMOCHAT_MONGO_ROOT_USERNAME: ${MEMOCHAT_MONGO_ROOT_USERNAME:?set MEMOCHAT_MONGO_ROOT_USERNAME}
      MEMOCHAT_MONGO_ROOT_PASSWORD: ${MEMOCHAT_MONGO_ROOT_PASSWORD:?set MEMOCHAT_MONGO_ROOT_PASSWORD}
      MEMOCHAT_MONGO_APP_USER: ${MEMOCHAT_MONGO_APP_USER:?set MEMOCHAT_MONGO_APP_USER}
      MEMOCHAT_MONGO_APP_PASSWORD: ${MEMOCHAT_MONGO_APP_PASSWORD:?set MEMOCHAT_MONGO_APP_PASSWORD}
    entrypoint:
      - /bin/sh
      - /provision/mongo.sh
    volumes:
      - ./provision:/provision:ro
    depends_on:
      memochat-mongo:
        condition: service_started

  memochat-release-provision-minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles:
      - provision
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /root/.mc:rw,noexec,nosuid,nodev,size=4m
    environment:
      MEMOCHAT_MINIO_ROOT_USER: ${MEMOCHAT_MINIO_ROOT_USER:?set MEMOCHAT_MINIO_ROOT_USER}
      MEMOCHAT_MINIO_ROOT_PASSWORD: ${MEMOCHAT_MINIO_ROOT_PASSWORD:?set MEMOCHAT_MINIO_ROOT_PASSWORD}
      MEMOCHAT_MINIO_APP_ACCESS_KEY: ${MEMOCHAT_MINIO_APP_ACCESS_KEY:?set MEMOCHAT_MINIO_APP_ACCESS_KEY}
      MEMOCHAT_MINIO_APP_SECRET_KEY: ${MEMOCHAT_MINIO_APP_SECRET_KEY:?set MEMOCHAT_MINIO_APP_SECRET_KEY}
    entrypoint:
      - /bin/sh
      - /provision/minio.sh
    volumes:
      - ./provision:/provision:ro
    depends_on:
      memochat-minio:
        condition: service_started

  memochat-release-provision-influxdb:
    <<: *observability-service
    image: influxdb@sha256:5455e9b8bb42dcb8aa0b8a0354b5f0758d0b4a01f595b8dc03e3f850aa5829e9
    profiles:
      - provision
    restart: "no"
    environment:
      INFLUX_HOST: http://memochat-influxdb:8086
      INFLUX_ORG: memochat
      INFLUX_TOKEN_FILE: /run/secrets/memochat-influxdb/influxdb-admin.token
      INFLUX_BUCKET: metrics
    entrypoint:
      - /bin/sh
      - /provision/influxdb_observability.sh
    volumes:
      - ./provision:/provision:ro
      - type: bind
        source: ${MEMOCHAT_DOCKER_DATA_ROOT:?set MEMOCHAT_DOCKER_DATA_ROOT}/observability/credentials
        target: /run/secrets/memochat-influxdb
        bind:
          create_host_path: false
    depends_on:
      memochat-influxdb:
        condition: service_healthy

  # Release mode must override every weak development default in the base file.
  memochat-redis:
    image: redis/redis-stack-server@sha256:b569cb292d85bd0c85807a485ee9407dfc596ccd3686516e5d81d753d65405b7
    environment:
      REDIS_ARGS: "--appendonly yes --requirepass ${MEMOCHAT_REDIS_PASSWORD:?set MEMOCHAT_REDIS_PASSWORD}"

  memochat-postgres:
    image: postgres@sha256:78df81b1442dcc764c1104154da7162635e40cfffe67579c42a1c1b96dfc209c
    environment:
      POSTGRES_USER: ${MEMOCHAT_POSTGRES_USER:?set MEMOCHAT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MEMOCHAT_POSTGRES_PASSWORD:?set MEMOCHAT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${MEMOCHAT_POSTGRES_DATABASE:?set MEMOCHAT_POSTGRES_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  memochat-mongo:
    image: mongo@sha256:adfc10cca964f99224ac4948e782c260c4c87e71958df334e8ca882ff85062ea
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MEMOCHAT_MONGO_ROOT_USERNAME:?set MEMOCHAT_MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MEMOCHAT_MONGO_ROOT_PASSWORD:?set MEMOCHAT_MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: memochat
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --eval 'db.runCommand({ping: 1}).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  memochat-minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    environment:
      MINIO_ROOT_USER: ${MEMOCHAT_MINIO_ROOT_USER:?set MEMOCHAT_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MEMOCHAT_MINIO_ROOT_PASSWORD:?set MEMOCHAT_MINIO_ROOT_PASSWORD}

  memochat-rabbitmq:
    image: rabbitmq@sha256:0b44fbcc3a4bf22d00090f1353127577dbe1fcb109c41669733a9d7ecf6c3a78
    environment:
      RABBITMQ_DEFAULT_USER: ${MEMOCHAT_RABBITMQ_USER:?set MEMOCHAT_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${MEMOCHAT_RABBITMQ_PASSWORD:?set MEMOCHAT_RABBITMQ_PASSWORD}

  memochat-redpanda:
    image: redpandadata/redpanda@sha256:c9983f650ad08015a781ec9974fe94e25c36e9f15be553db596afe179e5b2c3a
    user: ${MEMOCHAT_RUNTIME_UID:?set MEMOCHAT_RUNTIME_UID}:${MEMOCHAT_RUNTIME_GID:?set MEMOCHAT_RUNTIME_GID}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=${MEMOCHAT_RUNTIME_UID:?set MEMOCHAT_RUNTIME_UID},gid=${MEMOCHAT_RUNTIME_GID:?set MEMOCHAT_RUNTIME_GID},mode=0700
      - /etc/redpanda:rw,noexec,nosuid,nodev,size=4m,uid=${MEMOCHAT_RUNTIME_UID:?set MEMOCHAT_RUNTIME_UID},gid=${MEMOCHAT_RUNTIME_GID:?set MEMOCHAT_RUNTIME_GID},mode=0700

  memochat-influxdb:
    <<: *observability-service
    image: influxdb@sha256:5455e9b8bb42dcb8aa0b8a0354b5f0758d0b4a01f595b8dc03e3f850aa5829e9
    profiles:
      - observability
    environment: !override
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME_FILE: /run/secrets/memochat-influxdb/influxdb-username
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/memochat-influxdb/influxdb-password
      DOCKER_INFLUXDB_INIT_ORG: memochat
      DOCKER_INFLUXDB_INIT_BUCKET: metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/memochat-influxdb/influxdb-admin.token
      INFLUX_CONFIGS_PATH: /tmp/influx-configs
    volumes: !override
      - type: bind
        source: ${MEMOCHAT_DOCKER_DATA_ROOT:?set MEMOCHAT_DOCKER_DATA_ROOT}/observability/influxdb
        target: /var/lib/influxdb2
        bind:
          create_host_path: false
      - type: bind
        source: ${MEMOCHAT_DOCKER_DATA_ROOT:?set MEMOCHAT_DOCKER_DATA_ROOT}/observability/credentials
        target: /run/secrets/memochat-influxdb
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  memochat-grafana:
    <<: *observability-service
    image: grafana/grafana@sha256:886b56d5534e54f69a8cfcb4b8928da8fc753178a7a3d20c3f9b04b660169805
    profiles:
      - observability
    environment: !override
      GF_SECURITY_ADMIN_USER: ${MEMOCHAT_GRAFANA_ADMIN_USER:-}
      GF_SECURITY_ADMIN_PASSWORD: ${MEMOCHAT_GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_DEFAULT_THEME: light
      GF_LOG_MODE: console
      HOME: /tmp
    entrypoint:
      - /bin/sh
      - /provision/grafana_entrypoint.sh
    volumes: !override
      - type: bind
        source: ./provision
        target: /provision
        read_only: true
      - type: bind
        source: ./observability/grafana/provisioning/datasources
        target: /etc/grafana/provisioning/datasources
        read_only: true
      - type: bind
        source: ./observability/grafana/provisioning/dashboards
        target: /etc/grafana/provisioning/dashboards
        read_only: true
      - type: bind
        source: ./observability/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
      - type: bind
        source: ${MEMOCHAT_DOCKER_DATA_ROOT:?set MEMOCHAT_DOCKER_DATA_ROOT}/observability/grafana
        target: /var/lib/grafana
        bind:
          create_host_path: false
      - type: bind
        source: ${MEMOCHAT_DOCKER_DATA_ROOT:?set MEMOCHAT_DOCKER_DATA_ROOT}/observability/credentials
        target: /run/secrets/memochat-influxdb
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Do not inherit broad source/build mounts from the development stack.
  memochat-otel-collector:
    <<: *observability-service
    image: otel/opentelemetry-collector-contrib@sha256:b65527791431d76d058b2813748a3f4a8912540d7b23beac2f6b4e02c872f5b7
    profiles:
      - observability
    volumes: !override
      - type: bind
        source: ./observability/otel/config.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
      - type: bind
        source: ${MEMOCHAT_DOCKER_DATA_ROOT:?set MEMOCHAT_DOCKER_DATA_ROOT}/envoy/logs
        target: /workspace/envoy/logs
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=http://127.0.0.1:13133/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # cAdvisor is the sole observability exception: container discovery requires
  # root, privileged mode, /dev/kmsg, and read-only host namespace mounts.
  memochat-cadvisor:
    image: gcr.io/cadvisor/cadvisor@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    profiles:
      - observability
    user: "0:0"
    privileged: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  memochat-prometheus:
    <<: *observability-service
    image: prom/prometheus@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    profiles:
      - observability
    depends_on: !override
      memochat-alertmanager:
        condition: service_healthy
      memochat-cadvisor:
        condition: service_healthy
      memochat-otel-collector:
        condition: service_healthy
    volumes: !override
      - type: bind
        source: ./observability/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ./observability/prometheus/rules
        target: /etc/prometheus/rules
        read_only: true
      - type: bind
        source: ${MEMOCHAT_DOCKER_DATA_ROOT:?set MEMOCHAT_DOCKER_DATA_ROOT}/observability/prometheus
        target: /prometheus
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  memochat-alertmanager:
    <<: *observability-service
    image: prom/alertmanager@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    profiles:
      - observability
    volumes: !override
      - type: bind
        source: ./observability/alertmanager/alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
      - type: bind
        source: ${MEMOCHAT_DOCKER_DATA_ROOT:?set MEMOCHAT_DOCKER_DATA_ROOT}/observability/alertmanager
        target: /alertmanager
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  memochat-loki:
    <<: *observability-service
    image: grafana/loki@sha256:e689cc634841c937de4d7ea6157f17e29cf257d6a320f1c293ab18d46cfea986
    profiles:
      - observability
    volumes: !override
      - type: bind
        source: ./observability/loki/config.yaml
        target: /etc/loki/config.yaml
        read_only: true
      - type: bind
        source: ${MEMOCHAT_DOCKER_DATA_ROOT:?set MEMOCHAT_DOCKER_DATA_ROOT}/observability/loki
        target: /loki
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  memochat-tempo:
    <<: *observability-service
    image: grafana/tempo@sha256:f0200a9bff6d14eb3a4332194f7b77c37ee1a3535e7e41db024d95aab6f1b4e8
    profiles:
      - observability
    volumes: !override
      - type: bind
        source: ./observability/tempo/config.yaml
        target: /etc/tempo/config.yaml
        read_only: true
      - type: bind
        source: ${MEMOCHAT_DOCKER_DATA_ROOT:?set MEMOCHAT_DOCKER_DATA_ROOT}/observability/tempo
        target: /var/tempo
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Existing Envoy clusters use host.docker.internal. The release overlay keeps
  # those stable ports private by colocating every C++ process with Envoy.
  memochat-envoy-gateway:
    image: envoyproxy/envoy@sha256:8146b97ee61a42cd216514709e4e3198af75f014974e3d9f310aef9c901fcbdf
    user: ${MEMOCHAT_RUNTIME_UID:?set MEMOCHAT_RUNTIME_UID}:${MEMOCHAT_RUNTIME_GID:?set MEMOCHAT_RUNTIME_GID}
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    entrypoint: !override
      - /usr/local/bin/envoy
    command: !override
      - -c
      - /etc/envoy/envoy.yaml
    ports: !override
      - "127.0.0.1:80:80"
      - "127.0.0.1:8443:8443/tcp"
