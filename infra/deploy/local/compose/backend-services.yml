      MEMOCHAT_AUTHTOKEN_JWTSECRET: ${MEMOCHAT_AUTHTOKEN_JWTSECRET:?set MEMOCHAT_AUTHTOKEN_JWTSECRET}
      MEMOCHAT_AUTH_REFRESH_PEPPER: ${MEMOCHAT_AUTH_REFRESH_PEPPER:?set MEMOCHAT_AUTH_REFRESH_PEPPER}
      REQUIRED_ENV_VARS: MEMOCHAT_POSTGRES_PASSWD MEMOCHAT_REDIS_PASSWD MEMOCHAT_CHATAUTH_HMACSECRET MEMOCHAT_AUTHTOKEN_JWTSECRET MEMOCHAT_AUTH_REFRESH_PEPPER
