      MEMOCHAT_SERVICE: AccountServer
      MEMOCHAT_HEALTHCHECK_TCP_PORT: "8103"
      MEMOCHAT_POSTGRES_USER: memo_account_app
      MEMOCHAT_POSTGRES_PASSWD: ${MEMOCHAT_ACCOUNT_POSTGRES_PASSWORD:?set MEMOCHAT_ACCOUNT_POSTGRES_PASSWORD}
