      MEMOCHAT_RABBITMQ_PASSWORD: ${MEMOCHAT_RABBITMQ_PASSWORD:?set MEMOCHAT_RABBITMQ_PASSWORD}
      MEMOCHAT_EMAIL_SMTPUSER: ${MEMOCHAT_EMAIL_SMTPUSER:?set MEMOCHAT_EMAIL_SMTPUSER}
      MEMOCHAT_EMAIL_SMTPPASS: ${MEMOCHAT_EMAIL_SMTPPASS:?set MEMOCHAT_EMAIL_SMTPPASS}
      MEMOCHAT_EMAIL_FROM: ${MEMOCHAT_EMAIL_FROM:?set MEMOCHAT_EMAIL_FROM}
      REQUIRED_ENV_VARS: MEMOCHAT_REDIS_PASSWD MEMOCHAT_RABBITMQ_PASSWORD MEMOCHAT_EMAIL_SMTPUSER MEMOCHAT_EMAIL_SMTPPASS MEMOCHAT_EMAIL_FROM
    volumes:
