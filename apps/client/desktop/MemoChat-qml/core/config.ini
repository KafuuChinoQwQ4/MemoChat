[GateServer]
host=127.0.0.1
scheme=https
# 默认经由本地 Docker Envoy TLS 入口转发到 GateServer（8080/8084）。
port=8443
# HTTP/1.1 与 HTTP/2 都在同一个 TLS 入口协商，不允许回退到明文端口。
http_port=8443
http2_port=8443
http3_port=8443
preferred_http_protocol=http2
# 私有部署 CA 可写相对客户端目录的路径；也可用 MEMOCHAT_CLIENT_CA_FILE 注入。
ca_file=

[AI]
# 留空时与认证请求共用本地 Envoy TLS 入口。
BaseUrl=

[Media]
# 留空时与认证请求共用本地 Envoy TLS 入口。
BaseUrl=
MaxImageMB=200
MaxFileMB=20480
ChunkSizeKB=4096
ChunkRetry=3

[Call]
LiveKitUrl=ws://127.0.0.1:7880
CallBaseUrl=https://127.0.0.1:8443
LiveKitWsUrl=ws://127.0.0.1:7880
LiveKitUiUrl=qrc:/web/livekit/index.html
UseEmbeddedWebView=true

[Log]
Level=info
Dir=./logs
Format=json
ToConsole=true
RotateMode=daily
MaxFiles=14
MaxSizeMB=100
Redact=true
Env=local

[Telemetry]
Enabled=false
OtlpEndpoint=
Protocol=zipkin-json
SampleRatio=1.0
ExportLogs=false
ExportTraces=false
ExportMetrics=false
ServiceName=
ServiceNamespace=memochat
