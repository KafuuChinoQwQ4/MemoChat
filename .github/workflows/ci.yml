name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Reject known weak dependency credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          weak_password='(Passwd|Password)[[:space:]]*=[[:space:]]*(123456|password)'
          weak_mongodb='mongodb://[^[:space:]]+:123456@'
          disabled_tls='sslmode:[[:space:]]*disable'
          mutable_prod_tag='newTag:[[:space:]]*latest'
          if git grep -nE "$weak_password|$weak_mongodb|$disabled_tls|$mutable_prod_tag" -- \
            ':!tests/**' \
            ':!*.md' \
            ':!.github/workflows/ci.yml'; then
            echo "Known weak credential or mutable production tag pattern found" >&2
            exit 1
          fi

      - name: Scan the current source tree with Gitleaks
        shell: bash
        run: |
          set -Eeuo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --location --silent --show-error "$url" -o "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" dir \
            --no-banner --redact .

      - name: Scan every commit introduced by this event with Gitleaks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$PULL_REQUEST_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "${PULL_REQUEST_BASE_SHA}^{commit}"
            commit_range="${PULL_REQUEST_BASE_SHA}..${GITHUB_SHA}"
          elif [[ "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ \
              && "$EVENT_BEFORE" != 0000000000000000000000000000000000000000 ]] \
              && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            commit_range="${EVENT_BEFORE}..${GITHUB_SHA}"
          else
            git fetch --no-tags origin main
            merge_base="$(git merge-base "$GITHUB_SHA" origin/main)"
            commit_range="${merge_base}..${GITHUB_SHA}"
          fi
          [[ "$(git rev-list --count "$commit_range")" -gt 0 ]] || exit 0
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" git \
            --no-banner --redact --log-opts="$commit_range" .

  release-contracts:
    name: Release and security contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install contract test dependencies
        run: python -m pip install pytest PyYAML

      - name: Reject tracked secrets and runtime state
        shell: bash
        run: |
          set -Eeuo pipefail
          forbidden_paths="$(
            git ls-files \
              | grep -Ei '(^|/)artifacts/logs/|(^|/)\.env($|\.)|\.(key|p12|pfx|jks|log|db|sqlite|sqlite3|dump)$' \
              | grep -Ev '(^|/)\.env(\.[^/]*)?\.example$' \
              || true
          )"
          if [[ -n "$forbidden_paths" ]]; then
            printf '%s\n' "$forbidden_paths" >&2
            echo "Tracked secrets or mutable runtime state are forbidden" >&2
            exit 1
          fi
          if git grep -Il -E -- \
            '-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{50,}|sk-[A-Za-z0-9_-]{32,}' \
            ':!tests/python/tools/release_security/test_release_security_contract.py'; then
            echo "High-confidence secret material is tracked" >&2
            exit 1
          fi

      - name: Verify version tag provenance
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "Release tag must be a semantic vX.Y.Z tag" >&2; exit 1; }
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git fetch --force --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" == tag ]] \
            || { echo "Release tags must be annotated" >&2; exit 1; }
          tag_commit="$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]] \
            || { echo "Release tag commit ${tag_commit} does not match GITHUB_SHA ${GITHUB_SHA}" >&2; exit 1; }
          {
            echo "tag_ref=${GITHUB_REF_NAME}"
            echo "tag_commit=${tag_commit}"
            echo "github_sha=${GITHUB_SHA}"
            echo "origin_main=$(git rev-parse origin/main)"
          } >> "$GITHUB_STEP_SUMMARY"
          git merge-base --is-ancestor "$tag_commit" origin/main \
            || { echo "Release tag commit is not contained in origin/main" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Scan complete Git history before a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -Eeuo pipefail
          git log --all --branches --tags --name-only --pretty=format: | sed '/^$/d' | sort -u > "${RUNNER_TEMP}/history-paths.txt"
          git ls-files | sort -u > "${RUNNER_TEMP}/current-paths.txt"
          comm -23 "${RUNNER_TEMP}/history-paths.txt" "${RUNNER_TEMP}/current-paths.txt" \
            | grep -Ei \
              '(^|/)artifacts/logs/|(^|/)loadtest[^/]*/.*\.(json|csv|log|txt)$|(^|/)(reports?|results?)/.*\.(json|csv|log|txt)$|\.(p12|pfx|jks|key)$' \
              > "${RUNNER_TEMP}/forbidden-history-paths.txt" \
            || true
          if [[ -s "${RUNNER_TEMP}/forbidden-history-paths.txt" ]]; then
            count="$(wc -l < "${RUNNER_TEMP}/forbidden-history-paths.txt")"
            echo "Git history still contains ${count} deleted runtime, load-test, report, or key paths" >&2
            echo "Rewrite all refs and rotate affected credentials before a versioned release" >&2
            exit 1
          fi

          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --location --silent --show-error "$url" -o "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" git \
            --no-banner --redact --log-opts="--all" .

      - name: Inspect distribution legal status
        shell: bash
        run: |
          set -Eeuo pipefail
          status_file="$RUNNER_TEMP/memochat-legal-status.txt"
          tools/scripts/release/verify_release_legal.sh \
            --status-file "$status_file"
          {
            echo '### Release legal status'
            echo
            echo '```text'
            cat "$status_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require complete distribution legal corpus
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -Eeuo pipefail
          tools/scripts/release/verify_release_legal.sh \
            --require-distribution-corpus \
            --source-sha "$GITHUB_SHA"

      - name: Validate release shell entrypoints
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n tools/scripts/status/deploy_services.sh
          bash -n tools/scripts/release/package_backend_deployment_kit.sh
          bash -n tools/scripts/release/package_backend_services.sh
          bash -n tools/scripts/release/audit_backend_images.sh
          bash -n tools/scripts/release/verify_release_legal.sh
          bash -n tools/scripts/release/package_linux_client.sh
          bash -n tools/scripts/release/load_build_environment.sh
          bash -n tools/scripts/release/run_release_compose.sh
          bash -n tools/scripts/release/verify_release_tree.sh
          bash -n infra/deploy/local/provision/postgres.sh
          bash -n infra/deploy/local/provision/mongo.sh
          bash -n infra/deploy/local/provision/minio.sh
          bash -n infra/deploy/images/common/entrypoints/server-entrypoint.sh

      - name: Run release contract tests
        run: |
          python -m pytest -q \
            tests/python/tools/release_security \
            tests/python/tools/release_integration \
            tests/python/apps/client_release \
            tests/python/infra/backend_release \
            tests/python/tools/scripts/status/test_status_deploy_contract.py

      - name: Parse workflow and deployment YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from yaml.nodes import MappingNode, ScalarNode, SequenceNode

          for path in (Path(".github/workflows/ci.yml"),):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"validated {path}")

          class ComposeLoader(yaml.SafeLoader):
              pass

          def construct_override(loader, node):
              if isinstance(node, MappingNode):
                  return loader.construct_mapping(node)
              if isinstance(node, SequenceNode):
                  return loader.construct_sequence(node)
              if isinstance(node, ScalarNode):
                  return loader.construct_scalar(node)
              raise TypeError(f"unsupported !override node: {type(node).__name__}")

          ComposeLoader.add_constructor("!override", construct_override)
          compose_path = Path("infra/deploy/local/compose/backend-services.yml")
          yaml.load(compose_path.read_text(encoding="utf-8"), Loader=ComposeLoader)
          print(f"validated {compose_path}")
          PY

      - name: Validate release Compose model
        run: |
          docker compose \
            --env-file infra/deploy/local/.env.release.example \
            -f infra/deploy/local/docker-compose.yml \
            -f infra/deploy/local/compose/backend-services.yml \
            -f infra/deploy/local/compose/livekit.yml \
            config --quiet

  ai-agent-regression:
    name: AI agent offline regression
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/server/core/AIOrchestrator/requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/server/core/AIOrchestrator/requirements-ci.txt

      - name: Run offline tests
        env:
          PYTHONPATH: apps/server/core/AIOrchestrator
        run: python -m unittest tests.python.apps.server.core.AIOrchestrator.test_ollama_recovery tests.python.apps.server.core.AIOrchestrator.test_harness_structure

  build-linux-client:
    name: Build portable Linux client
    if: github.event_name == 'push'
    needs: [secret-scan, release-contracts]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          clean: true

      - name: Verify release toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          test -r /root/.memochat-linux-env
          source tools/scripts/release/load_build_environment.sh /root/.memochat-linux-env
          command -v cmake ninja g++-16 qtpaths6 patchelf readelf ldd strip
          test -x "$VCPKG_ROOT/vcpkg"

      - name: Configure and build client
        shell: bash
        run: |
          set -Eeuo pipefail
          source tools/scripts/release/load_build_environment.sh /root/.memochat-linux-env
          cmake --preset linux-client-release-gcc16
          cmake --build --preset linux-client-release-gcc16 --target MemoChatQml

      - name: Package and verify client
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          source tools/scripts/release/load_build_environment.sh /root/.memochat-linux-env
          release_root="$(mktemp -d "${RUNNER_TEMP}/memochat-client-release.XXXXXX")"
          artifact_name="MemoChatQml-${GITHUB_SHA:0:12}-linux-x86_64"
          tools/scripts/release/package_linux_client.sh \
            --binary build-linux-client-release-gcc16/bin/MemoChatQml \
            --config build-linux-client-release-gcc16/bin/config.ini \
            --library-dir "$VCPKG_ROOT/installed-memochat-gcc16-client-release/x64-linux-memochat-release/lib" \
            --output-dir "$release_root" \
            --source-sha "$GITHUB_SHA" \
            --artifact-name "$artifact_name"
          tools/scripts/release/verify_release_tree.sh \
            --allow-file tools/scripts/release/client_release_scan.allowlist \
            "${release_root}/${artifact_name}"
          digest="$(awk '{print $1}' "${release_root}/${artifact_name}.tar.gz.sha256")"
          legal_status="${release_root}/${artifact_name}/legal/LEGAL-STATUS.txt"
          legal_status_sha256="$(sha256sum "$legal_status" | awk '{print $1}')"
          legal_source_sha="$(awk -F= '$1 == "release_source_sha" { print $2 }' "$legal_status")"
          legal_formal_ready="$(awk -F= '$1 == "formal_distribution_ready" { print $2 }' "$legal_status")"
          legal_corpus_status="$(awk -F= '$1 == "third_party_legal_corpus" { print $2 }' "$legal_status")"
          legal_corpus_review_id="$(awk -F= '$1 == "corpus_review_id" { print $2 }' "$legal_status")"
          legal_corpus_sha256="$(awk -F= '$1 == "corpus_sha256" { print $2 }' "$legal_status")"
          [[ "$legal_status_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$legal_source_sha" == "$GITHUB_SHA" ]]
          [[ "$legal_formal_ready" == true || "$legal_formal_ready" == false ]]
          python - \
            "$release_root/client.json" \
            "$artifact_name" \
            "$digest" \
            "$GITHUB_SHA" \
            "$legal_status_sha256" \
            "$legal_formal_ready" \
            "$legal_corpus_status" \
            "$legal_corpus_review_id" \
            "$legal_corpus_sha256" <<'PY'
          import json
          import sys
          from pathlib import Path

          (
              path,
              name,
              digest,
              source_sha,
              legal_status_sha256,
              legal_formal_ready,
              legal_corpus_status,
              legal_corpus_review_id,
              legal_corpus_sha256,
          ) = sys.argv[1:]
          Path(path).write_text(
              json.dumps(
                  {
                      "artifact": f"{name}.tar.gz",
                      "sha256": digest,
                      "source_sha": source_sha,
                      "legal": {
                          "release_source_sha": source_sha,
                          "formal_distribution_ready": legal_formal_ready == "true",
                          "third_party_legal_corpus": legal_corpus_status,
                          "corpus_review_id": legal_corpus_review_id,
                          "corpus_sha256": legal_corpus_sha256,
                          "status_sha256": legal_status_sha256,
                      },
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          echo "release_root=$release_root" >> "$GITHUB_OUTPUT"

      - name: Upload Linux client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux-client-release' || 'linux-client-validation' }}
          path: |
            ${{ steps.package.outputs.release_root }}/*.tar.gz
            ${{ steps.package.outputs.release_root }}/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload client metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'client-release-metadata' || 'client-validation-metadata' }}
          path: ${{ steps.package.outputs.release_root }}/client.json
          if-no-files-found: error
          retention-days: 14

  build-linux-backend:
    name: Build backend release bundles
    if: github.event_name == 'push'
    needs: [secret-scan, release-contracts, ai-agent-regression]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          clean: true

      - name: Verify release toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          test -r /root/.memochat-linux-env
          source tools/scripts/release/load_build_environment.sh /root/.memochat-linux-env
          command -v cmake ninja g++-16 docker patchelf python3 readelf ldd strip
          test -x "$VCPKG_ROOT/vcpkg"

      - name: Configure and build backend
        shell: bash
        run: |
          set -Eeuo pipefail
          source tools/scripts/release/load_build_environment.sh /root/.memochat-linux-env
          cmake --preset linux-server-release-gcc16
          cmake --build --preset linux-server-release-gcc16

      - name: Package and verify backend bundles
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          source tools/scripts/release/load_build_environment.sh /root/.memochat-linux-env
          release_parent="$(mktemp -d "${RUNNER_TEMP}/memochat-backend-release.XXXXXX")"
          release_root="${release_parent}/backend"
          tools/scripts/release/package_backend_services.sh \
            --build-bin build-linux-server-release-gcc16/bin \
            --library-dir "$VCPKG_ROOT/installed-memochat-gcc16-server-release/x64-linux-memochat-release/lib" \
            --vcpkg-installed-root "$VCPKG_ROOT/installed-memochat-gcc16-server-release" \
            --vcpkg-triplet x64-linux-memochat-release \
            --source-sha "$GITHUB_SHA" \
            --output "$release_root"
          for service_bundle in "$release_root"/*; do
            tools/scripts/release/verify_release_tree.sh "$service_bundle"
          done
          tools/scripts/release/package_backend_deployment_kit.sh \
            --source-sha "$GITHUB_SHA" \
            --output "${release_parent}/deployment"
          sbom_root="${release_parent}/vcpkg-sboms"
          mkdir -m 0700 "$sbom_root"
          declare -A image_slugs=(
            [AIGatewayServer]=ai-gateway
            [AIServer]=ai-server
            [AccountServer]=account-server
            [CallGatewayServer]=call-gateway
            [ChatDeliveryWorker]=chat-delivery-worker
            [ChatMessageService]=chat-message-service
            [ChatRelationQueryService]=chat-relation-query-service
            [ChatRelationServiceWorker]=chat-relation-service-worker
            [ChatServer]=chat-server
            [LoginServer]=login-server
            [MediaGatewayServer]=media-gateway
            [MomentsGatewayServer]=moments-gateway
            [R18GatewayServer]=r18-gateway
            [RegisterServer]=register-server
            [VarifyServer]=varify-server
          )
          for target in "${!image_slugs[@]}"; do
            source_sbom="${release_root}/${target}/sbom/vcpkg-build-dependencies.spdx.json"
            expected_sha256="$(
              awk -F= '$1 == "vcpkg_sbom_sha256" { print $2 }' \
                "${release_root}/${target}/MANIFEST.txt"
            )"
            [[ "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$(sha256sum "$source_sbom" | awk '{print $1}')" == "$expected_sha256" ]]
            install -m 0444 "$source_sbom" \
              "${sbom_root}/${image_slugs[$target]}.vcpkg.spdx.json"
          done
          [[ "$(find "$sbom_root" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 15 ]]
          archive="${release_parent}/MemoChat-backend-${GITHUB_SHA:0:12}-linux-x86_64.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C "$release_parent" backend deployment
          (
            cd "$release_parent"
            sha256sum "$(basename -- "$archive")" > "$(basename -- "$archive").sha256"
          )
          echo "release_parent=$release_parent" >> "$GITHUB_OUTPUT"
          echo "release_root=$release_root" >> "$GITHUB_OUTPUT"
          echo "sbom_root=$sbom_root" >> "$GITHUB_OUTPUT"

      - name: Validate representative runtime image
        shell: bash
        run: |
          set -Eeuo pipefail
          empty_context="$(mktemp -d "${RUNNER_TEMP}/memochat-empty-docker-context.XXXXXX")"
          docker buildx build \
            --build-context "service_bundle=${{ steps.package.outputs.release_root }}/ChatServer" \
            --build-context "server_entrypoint=$GITHUB_WORKSPACE/infra/deploy/images/common/entrypoints" \
            --build-arg TARGET=ChatServer \
            --file infra/deploy/images/services/cpp-service.Dockerfile \
            --tag memochat-ci/chatserver:${GITHUB_SHA} \
            --load "$empty_context"

      - name: Upload backend bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux-backend-release' || 'linux-backend-validation' }}
          path: |
            ${{ steps.package.outputs.release_parent }}/*.tar.gz
            ${{ steps.package.outputs.release_parent }}/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload commit-bound vcpkg dependency SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'backend-vcpkg-sboms' || 'backend-vcpkg-validation-sboms' }}
          path: ${{ steps.package.outputs.sbom_root }}/*.vcpkg.spdx.json
          if-no-files-found: error
          retention-days: 30

  publish-backend-images:
    name: Publish immutable backend images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-contracts, build-linux-backend]
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-images-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download backend release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-backend-release
          path: incoming

      - name: Verify and extract backend release
        id: extract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd incoming
          sha256sum --check --strict ./*.tar.gz.sha256
          archive="$(realpath ./*.tar.gz)"
          archive_name="$(basename -- "$archive")"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$archive_name" == "MemoChat-backend-${GITHUB_SHA:0:12}-linux-x86_64.tar.gz" ]]
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          release_root="$(mktemp -d "${RUNNER_TEMP}/memochat-backend-images.XXXXXX")"
          tar -xzf "$archive" -C "$release_root"
          for service_bundle in "$release_root"/backend/*; do
            "$GITHUB_WORKSPACE/tools/scripts/release/verify_release_tree.sh" "$service_bundle"
          done
          (
            cd "$release_root/deployment"
            sha256sum --check --strict SHA256SUMS
          )
          deployment_manifest="$release_root/deployment/MANIFEST.txt"
          deployment_legal_status="$release_root/deployment/legal/LEGAL-STATUS.txt"
          [[ "$(awk -F= '$1 == "release_source_sha" { print $2 }' "$deployment_manifest")" == "$GITHUB_SHA" ]]
          [[ "$(awk -F= '$1 == "formal_distribution_ready" { print $2 }' "$deployment_manifest")" == true ]]
          deployment_legal_sha256="$(sha256sum "$deployment_legal_status" | awk '{print $1}')"
          [[ "$(awk -F= '$1 == "legal_status_sha256" { print $2 }' "$deployment_manifest")" == "$deployment_legal_sha256" ]]
          echo "release_root=${release_root}/backend" >> "$GITHUB_OUTPUT"
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish service images
        id: publish
        shell: bash
        env:
          RELEASE_ROOT: ${{ steps.extract.outputs.release_root }}
          BACKEND_ARCHIVE_NAME: ${{ steps.extract.outputs.archive_name }}
          BACKEND_ARCHIVE_SHA256: ${{ steps.extract.outputs.archive_sha256 }}
        run: |
          set -Eeuo pipefail
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/memochat"
          immutable_tag="sha-${GITHUB_SHA}"
          metadata_tsv="${RUNNER_TEMP}/memochat-image-metadata.tsv"
          expected_digests_tsv="${RUNNER_TEMP}/memochat-image-expected-digests.tsv"
          bundle_hashes_tsv="${RUNNER_TEMP}/memochat-bundle-hashes.tsv"
          common_legal_status_sha256=""
          common_corpus_review_id=""
          common_corpus_sha256=""
          declare -A image_slugs=(
            [AIGatewayServer]=ai-gateway
            [AIServer]=ai-server
            [AccountServer]=account-server
            [CallGatewayServer]=call-gateway
            [ChatDeliveryWorker]=chat-delivery-worker
            [ChatMessageService]=chat-message-service
            [ChatRelationQueryService]=chat-relation-query-service
            [ChatRelationServiceWorker]=chat-relation-service-worker
            [ChatServer]=chat-server
            [LoginServer]=login-server
            [MediaGatewayServer]=media-gateway
            [MomentsGatewayServer]=moments-gateway
            [R18GatewayServer]=r18-gateway
            [RegisterServer]=register-server
            [VarifyServer]=varify-server
          )

          manifest_value() {
            local manifest="$1"
            local key="$2"
            local value
            value="$(awk -F= -v key="$key" '$1 == key { print $2 }' "$manifest")"
            [[ -n "$value" && "$(grep -c "^${key}=" "$manifest")" -eq 1 ]] || {
              echo "Bundle manifest has an invalid ${key}: ${manifest}" >&2
              return 1
            }
            printf '%s\n' "$value"
          }

          inspect_digest() {
            local reference="$1"
            local output
            if output="$(
              docker buildx imagetools inspect "$reference" \
                --format '{{.Manifest.Digest}}' 2>&1
            )"; then
              if [[ ! "$output" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "Registry returned an invalid digest for ${reference}" >&2
                return 2
              fi
              printf '%s\n' "$output"
              return 0
            fi
            if [[ "$output" == *"not found"* || "$output" == *"manifest unknown"* ]]; then
              return 1
            fi
            printf '%s\n' "$output" >&2
            return 2
          }

          verify_bundle_binding() {
            local reference="$1"
            local target="$2"
            local expected_bundle_sha256="$3"
            local expected_vcpkg_sbom_sha256="$4"
            local expected_legal_status_sha256="$5"
            local labels
            if ! labels="$(
              docker buildx imagetools inspect "$reference" \
                --format '{{json .Image.Config.Labels}}' 2>&1
            )"; then
              printf '%s\n' "$labels" >&2
              return 2
            fi
            if ! jq -e \
              --arg revision "$GITHUB_SHA" \
              --arg target "$target" \
              --arg bundle_sha256 "$expected_bundle_sha256" \
              --arg vcpkg_sbom_sha256 "$expected_vcpkg_sbom_sha256" \
              --arg legal_status_sha256 "$expected_legal_status_sha256" \
              'type == "object"
               and .["org.opencontainers.image.revision"] == $revision
               and .["io.memochat.service.target"] == $target
               and .["io.memochat.bundle.sha256"] == $bundle_sha256
               and .["io.memochat.vcpkg.sbom.sha256"] == $vcpkg_sbom_sha256
               and .["io.memochat.legal.status.sha256"] == $legal_status_sha256' \
              <<< "$labels" >/dev/null; then
              echo "Commit image bundle binding mismatch: ${reference}" >&2
              return 1
            fi
          }

          mapfile -t targets < <(
            find "$RELEASE_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | LC_ALL=C sort
          )
          if [[ "${#targets[@]}" -ne "${#image_slugs[@]}" ]]; then
            echo "Backend bundle target set does not match the 15-service release topology" >&2
            exit 1
          fi
          for target in "${targets[@]}"; do
            [[ -n "${image_slugs[$target]:-}" ]] || {
              echo "Unexpected backend bundle target: ${target}" >&2
              exit 1
            }
          done

          : > "$metadata_tsv"
          : > "$expected_digests_tsv"
          : > "$bundle_hashes_tsv"
          for target in "${targets[@]}"; do
            bundle="${RELEASE_ROOT}/${target}"
            [[ -f "${bundle}/MANIFEST.txt" && -f "${bundle}/SHA256SUMS" ]]
            [[ -s "${bundle}/sbom/vcpkg-build-dependencies.spdx.json" ]]
            [[ -s "${bundle}/legal/LEGAL-STATUS.txt" ]]
            bundle_sha256="$(
              (
                cd "$bundle"
                sha256sum MANIFEST.txt SHA256SUMS
              ) | sha256sum | awk '{print $1}'
            )"
            [[ "$bundle_sha256" =~ ^[0-9a-f]{64}$ ]]
            vcpkg_sbom_sha256="$(manifest_value "${bundle}/MANIFEST.txt" vcpkg_sbom_sha256)"
            legal_status_sha256="$(manifest_value "${bundle}/MANIFEST.txt" legal_status_sha256)"
            [[ "$vcpkg_sbom_sha256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$legal_status_sha256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$(sha256sum "${bundle}/sbom/vcpkg-build-dependencies.spdx.json" | awk '{print $1}')" == "$vcpkg_sbom_sha256" ]]
            [[ "$(sha256sum "${bundle}/legal/LEGAL-STATUS.txt" | awk '{print $1}')" == "$legal_status_sha256" ]]
            [[ "$(manifest_value "${bundle}/MANIFEST.txt" release_source_sha)" == "$GITHUB_SHA" ]]
            [[ "$(manifest_value "${bundle}/MANIFEST.txt" vcpkg_sbom_source_sha)" == "$GITHUB_SHA" ]]
            [[ "$(manifest_value "${bundle}/MANIFEST.txt" formal_distribution_ready)" == true ]]
            [[ "$(manifest_value "${bundle}/MANIFEST.txt" third_party_legal_corpus)" == complete ]]
            corpus_review_id="$(manifest_value "${bundle}/MANIFEST.txt" corpus_review_id)"
            corpus_sha256="$(manifest_value "${bundle}/MANIFEST.txt" corpus_sha256)"
            [[ "$corpus_review_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$ ]]
            [[ "$corpus_sha256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$(manifest_value "${bundle}/legal/LEGAL-STATUS.txt" release_source_sha)" == "$GITHUB_SHA" ]]
            [[ "$(manifest_value "${bundle}/legal/LEGAL-STATUS.txt" formal_distribution_ready)" == true ]]
            [[ "$(manifest_value "${bundle}/legal/LEGAL-STATUS.txt" third_party_legal_corpus)" == complete ]]
            [[ "$(manifest_value "${bundle}/legal/LEGAL-STATUS.txt" corpus_review_id)" == "$corpus_review_id" ]]
            [[ "$(manifest_value "${bundle}/legal/LEGAL-STATUS.txt" corpus_sha256)" == "$corpus_sha256" ]]
            jq -e --arg source_sha "$GITHUB_SHA" '
              .documentComment == (
                "release_source_sha=" + $source_sha +
                "; coverage=installed-closure-overapproximation"
              )
            ' "${bundle}/sbom/vcpkg-build-dependencies.spdx.json" >/dev/null
            if [[ -z "$common_legal_status_sha256" ]]; then
              common_legal_status_sha256="$legal_status_sha256"
              common_corpus_review_id="$corpus_review_id"
              common_corpus_sha256="$corpus_sha256"
            fi
            [[ "$legal_status_sha256" == "$common_legal_status_sha256" ]]
            [[ "$corpus_review_id" == "$common_corpus_review_id" ]]
            [[ "$corpus_sha256" == "$common_corpus_sha256" ]]
            printf '%s\t%s\t%s\t%s\n' \
              "$target" "$bundle_sha256" "$vcpkg_sbom_sha256" "$legal_status_sha256" \
              >> "$bundle_hashes_tsv"
          done
          empty_context="$(mktemp -d "${RUNNER_TEMP}/memochat-empty-docker-context.XXXXXX")"
          for target in "${targets[@]}"; do
            bundle="${RELEASE_ROOT}/${target}"
            slug="${image_slugs[$target]}"
            image="${image_prefix}/${slug}"
            reference="${image}:${immutable_tag}"
            bundle_sha256="$(
              awk -F '\t' -v expected_target="$target" \
                '$1 == expected_target { print $2 }' "$bundle_hashes_tsv"
            )"
            vcpkg_sbom_sha256="$(
              awk -F '\t' -v expected_target="$target" \
                '$1 == expected_target { print $3 }' "$bundle_hashes_tsv"
            )"
            legal_status_sha256="$(
              awk -F '\t' -v expected_target="$target" \
                '$1 == expected_target { print $4 }' "$bundle_hashes_tsv"
            )"
            inspect_status=0
            digest="$(inspect_digest "$reference")" || inspect_status=$?
            if [[ "$inspect_status" -eq 0 ]]; then
              verify_bundle_binding \
                "$reference" "$target" "$bundle_sha256" \
                "$vcpkg_sbom_sha256" "$legal_status_sha256"
            elif [[ "$inspect_status" -eq 1 ]]; then
              docker buildx build \
                --build-context "service_bundle=${bundle}" \
                --build-context "server_entrypoint=$GITHUB_WORKSPACE/infra/deploy/images/common/entrypoints" \
                --build-arg "TARGET=${target}" \
                --file infra/deploy/images/services/cpp-service.Dockerfile \
                --tag "$reference" \
                --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --label "io.memochat.service.target=${target}" \
                --label "io.memochat.bundle.sha256=${bundle_sha256}" \
                --label "io.memochat.vcpkg.sbom.sha256=${vcpkg_sbom_sha256}" \
                --label "io.memochat.legal.status.sha256=${legal_status_sha256}" \
                --provenance=mode=max \
                --push "$empty_context"
              digest="$(inspect_digest "$reference")"
            else
              exit "$inspect_status"
            fi
            printf '%s\t%s\n' "$target" "$digest" >> "$expected_digests_tsv"
          done

          if [[ "$(wc -l < "$expected_digests_tsv")" -ne "${#targets[@]}" ]]; then
            echo "Commit image digest set is incomplete" >&2
            exit 1
          fi
          for target in "${targets[@]}"; do
            slug="${image_slugs[$target]}"
            image="${image_prefix}/${slug}"
            reference="${image}:${immutable_tag}"
            expected_digest="$(
              awk -F '\t' -v expected_target="$target" \
                '$1 == expected_target { print $2 }' "$expected_digests_tsv"
            )"
            bundle_sha256="$(
              awk -F '\t' -v expected_target="$target" \
                '$1 == expected_target { print $2 }' "$bundle_hashes_tsv"
            )"
            vcpkg_sbom_sha256="$(
              awk -F '\t' -v expected_target="$target" \
                '$1 == expected_target { print $3 }' "$bundle_hashes_tsv"
            )"
            legal_status_sha256="$(
              awk -F '\t' -v expected_target="$target" \
                '$1 == expected_target { print $4 }' "$bundle_hashes_tsv"
            )"
            digest="$(inspect_digest "$reference")"
            if [[ "$digest" != "$expected_digest" ]]; then
              echo "Commit image tag changed during publication: ${reference}" >&2
              exit 1
            fi
            verify_bundle_binding \
              "$reference" "$target" "$bundle_sha256" \
              "$vcpkg_sbom_sha256" "$legal_status_sha256"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$target" "$image" "$immutable_tag" "$digest" "$bundle_sha256" \
              "$vcpkg_sbom_sha256" "$legal_status_sha256" \
              >> "$metadata_tsv"
          done
          metadata_dir="${RUNNER_TEMP}/memochat-backend-image-metadata"
          mkdir -p "$metadata_dir"
          python - \
            "$metadata_tsv" \
            "$metadata_dir/backend-images.json" \
            "$GITHUB_SHA" \
            "$BACKEND_ARCHIVE_NAME" \
            "$BACKEND_ARCHIVE_SHA256" \
            "$common_legal_status_sha256" \
            "$common_corpus_review_id" \
            "$common_corpus_sha256" <<'PY'
          import json
          import sys
          from pathlib import Path

          (
              rows,
              output,
              source_sha,
              archive_name,
              archive_sha256,
              legal_status_sha256,
              corpus_review_id,
              corpus_sha256,
          ) = sys.argv[1:]
          images = []
          for line in Path(rows).read_text(encoding="utf-8").splitlines():
              (
                  target,
                  image,
                  tag,
                  digest,
                  bundle_sha256,
                  vcpkg_sbom_sha256,
                  image_legal_status_sha256,
              ) = line.split("\t")
              images.append(
                  {
                      "target": target,
                      "image": image,
                      "tag": tag,
                      "digest": digest,
                      "bundle_sha256": bundle_sha256,
                      "vcpkg_sbom_sha256": vcpkg_sbom_sha256,
                      "legal_status_sha256": image_legal_status_sha256,
                  }
              )
          Path(output).write_text(
              json.dumps(
                  {
                      "schema": "memochat-backend-images-v1",
                      "source_sha": source_sha,
                      "archive": {
                          "artifact": archive_name,
                          "sha256": archive_sha256,
                      },
                      "legal": {
                          "release_source_sha": source_sha,
                          "formal_distribution_ready": True,
                          "third_party_legal_corpus": "complete",
                          "corpus_review_id": corpus_review_id,
                          "corpus_sha256": corpus_sha256,
                          "status_sha256": legal_status_sha256,
                      },
                      "images": images,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          echo "metadata_dir=$metadata_dir" >> "$GITHUB_OUTPUT"

      - name: Upload backend image metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-image-metadata
          path: ${{ steps.publish.outputs.metadata_dir }}/backend-images.json
          if-no-files-found: error
          retention-days: 14

  audit-backend-images:
    name: Audit immutable backend images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish-backend-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download backend image metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-image-metadata
          path: metadata

      - name: Download commit-bound vcpkg dependency SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-vcpkg-sboms
          path: metadata/vcpkg

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image audit workspace
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          audit_root="${RUNNER_TEMP}/memochat-backend-image-audit"
          [[ ! -e "$audit_root" && ! -L "$audit_root" ]]
          mkdir -m 0700 "$audit_root"
          mkdir -m 0700 "$audit_root/raw"
          printf 'started\n' > "$audit_root/AUDIT_JOB_STARTED"
          echo "audit_root=$audit_root" >> "$GITHUB_OUTPUT"

      - name: Install pinned Syft and Grype
        id: scanners
        shell: bash
        run: |
          set -Eeuo pipefail
          syft_version=1.44.0
          grype_version=0.112.0
          syft_archive="syft_${syft_version}_linux_amd64.tar.gz"
          grype_archive="grype_${grype_version}_linux_amd64.tar.gz"
          syft_url="https://github.com/anchore/syft/releases/download/v${syft_version}/${syft_archive}"
          grype_url="https://github.com/anchore/grype/releases/download/v${grype_version}/${grype_archive}"
          scanner_root="$(mktemp -d "${RUNNER_TEMP}/memochat-scanners.XXXXXX")"
          curl --fail --location --silent --show-error --retry 3 \
            "$syft_url" -o "${scanner_root}/${syft_archive}"
          curl --fail --location --silent --show-error --retry 3 \
            "$grype_url" -o "${scanner_root}/${grype_archive}"
          printf '%s  %s\n' \
            0e91737aee2b5baf1d255b959630194a302335d848ff97bb07921eb6205b5f5a \
            "${scanner_root}/${syft_archive}" | sha256sum --check --strict
          printf '%s  %s\n' \
            acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea \
            "${scanner_root}/${grype_archive}" | sha256sum --check --strict
          tar -xzf "${scanner_root}/${syft_archive}" -C "$scanner_root" syft
          tar -xzf "${scanner_root}/${grype_archive}" -C "$scanner_root" grype
          chmod 0555 "$scanner_root/syft" "$scanner_root/grype"
          "$scanner_root/syft" version
          "$scanner_root/grype" version
          echo "syft_bin=$scanner_root/syft" >> "$GITHUB_OUTPUT"
          echo "grype_bin=$scanner_root/grype" >> "$GITHUB_OUTPUT"

      - name: Update the pinned Grype vulnerability database
        shell: bash
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
          GRYPE_DB_AUTO_UPDATE: "false"
        run: |
          set -Eeuo pipefail
          grype_bin="${{ steps.scanners.outputs.grype_bin }}"
          grype_config="${RUNNER_TEMP}/memochat-grype-config.yaml"
          printf '{}\n' > "$grype_config"
          chmod 0400 "$grype_config"
          "$grype_bin" db update --config "$grype_config"
          "$grype_bin" db status -o json --config "$grype_config" \
            | jq -e 'type == "object"' >/dev/null

      - name: Audit digest-bound backend images
        shell: bash
        run: |
          set -Eeuo pipefail
          image_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/memochat"
          tools/scripts/release/audit_backend_images.sh \
            --output-dir "${{ steps.prepare.outputs.audit_root }}/raw/evidence" \
            --syft "${{ steps.scanners.outputs.syft_bin }}" \
            --grype "${{ steps.scanners.outputs.grype_bin }}" \
            --image-prefix "$image_prefix" \
            --image-manifest metadata/backend-images.json \
            --vcpkg-sbom-dir metadata/vcpkg \
            --pull \
            --fail-on high

      - name: Package deterministic image audit evidence
        id: package-audit
        shell: bash
        run: |
          set -Eeuo pipefail
          audit_root="${{ steps.prepare.outputs.audit_root }}"
          evidence_root="$audit_root/raw/evidence"
          [[ "$(cat "$evidence_root/AUDIT_COMPLETE")" == complete ]]
          (
            cd "$evidence_root"
            sha256sum --check --strict SHA256SUMS
          )
          image_manifest_sha256="$(sha256sum metadata/backend-images.json | awk '{print $1}')"
          copied_manifest_sha256="$(
            sha256sum "$evidence_root/BACKEND_IMAGES.json" | awk '{print $1}'
          )"
          [[ "$copied_manifest_sha256" == "$image_manifest_sha256" ]]
          archive_name="backend-image-audit-${GITHUB_SHA:0:12}.tar.gz"
          archive="$audit_root/$archive_name"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C "$evidence_root" .
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$archive_sha256" "$archive_name" \
            > "${archive}.sha256"
          python - \
            "$audit_root/audit.json" \
            "$archive_name" \
            "$archive_sha256" \
            "$GITHUB_SHA" \
            "$image_manifest_sha256" <<'PY'
          import json
          import sys
          from pathlib import Path

          output, artifact, sha256, source_sha, image_manifest_sha256 = sys.argv[1:]
          Path(output).write_text(
              json.dumps(
                  {
                      "schema": "memochat-backend-image-audit-artifact-v1",
                      "source_sha": source_sha,
                      "artifact": artifact,
                      "sha256": sha256,
                      "image_manifest_sha256": image_manifest_sha256,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          printf 'complete\n' > "$audit_root/AUDIT_JOB_COMPLETE"

      - name: Attest backend image audit evidence
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ steps.prepare.outputs.audit_root }}/backend-image-audit-*.tar.gz

      - name: Upload backend image audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-image-audit
          path: ${{ runner.temp }}/memochat-backend-image-audit
          if-no-files-found: error
          retention-days: 30

  attest-release-artifacts:
    name: Attest release archives
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-client, build-linux-backend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: linux-*-release
          path: attest

      - name: Create GitHub build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            attest/linux-client-release/*.tar.gz
            attest/linux-backend-release/*.tar.gz

  release-metadata:
    name: Assemble verified release metadata
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-client, publish-backend-images, audit-backend-images, attest-release-artifacts]
    runs-on: ubuntu-24.04
    steps:
      - name: Download client metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: client-release-metadata
          path: metadata/client

      - name: Download image metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-image-metadata
          path: metadata/backend

      - name: Download backend image audit evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-image-audit
          path: metadata/audit

      - name: Validate and assemble manifest
        run: |
          python - "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          source_sha = sys.argv[1]
          client = json.loads(Path("metadata/client/client.json").read_text(encoding="utf-8"))
          backend = json.loads(Path("metadata/backend/backend-images.json").read_text(encoding="utf-8"))
          audit = json.loads(Path("metadata/audit/audit.json").read_text(encoding="utf-8"))
          expected_targets = {
              "AIGatewayServer", "AIServer", "AccountServer", "CallGatewayServer",
              "ChatDeliveryWorker", "ChatMessageService", "ChatRelationQueryService",
              "ChatRelationServiceWorker", "ChatServer", "LoginServer",
              "MediaGatewayServer", "MomentsGatewayServer", "R18GatewayServer",
              "RegisterServer", "VarifyServer",
          }
          if (
              client["source_sha"] != source_sha
              or backend.get("schema") != "memochat-backend-images-v1"
              or backend["source_sha"] != source_sha
              or audit.get("schema") != "memochat-backend-image-audit-artifact-v1"
              or audit.get("source_sha") != source_sha
          ):
              raise SystemExit("release metadata source SHA mismatch")
          backend_legal = backend.get("legal", {})
          client_legal = client.get("legal", {})
          required_legal = {
              "release_source_sha": source_sha,
              "formal_distribution_ready": True,
              "third_party_legal_corpus": "complete",
          }
          if any(backend_legal.get(key) != value for key, value in required_legal.items()):
              raise SystemExit("backend legal summary is not formal or source-bound")
          if client_legal != backend_legal:
              raise SystemExit("client and backend legal summaries do not match")
          for key in ("corpus_sha256", "status_sha256"):
              if not re.fullmatch(r"[0-9a-f]{64}", backend_legal.get(key, "")):
                  raise SystemExit(f"invalid legal summary digest: {key}")
          if not re.fullmatch(
              r"[A-Za-z0-9][A-Za-z0-9._-]{7,127}",
              backend_legal.get("corpus_review_id", ""),
          ):
              raise SystemExit("invalid legal corpus review id")
          expected_client_artifact = f"MemoChatQml-{source_sha[:12]}-linux-x86_64.tar.gz"
          if client.get("artifact") != expected_client_artifact or not re.fullmatch(
              r"[0-9a-f]{64}", client.get("sha256", "")
          ):
              raise SystemExit("invalid client release archive metadata")
          backend_archive = backend.get("archive", {})
          expected_backend_artifact = f"MemoChat-backend-{source_sha[:12]}-linux-x86_64.tar.gz"
          if backend_archive.get("artifact") != expected_backend_artifact or not re.fullmatch(
              r"[0-9a-f]{64}", backend_archive.get("sha256", "")
          ):
              raise SystemExit("invalid backend release archive metadata")
          expected_audit_artifact = f"backend-image-audit-{source_sha[:12]}.tar.gz"
          if audit.get("artifact") != expected_audit_artifact or not re.fullmatch(
              r"[0-9a-f]{64}", audit.get("sha256", "")
          ):
              raise SystemExit("invalid backend image audit metadata")
          if not re.fullmatch(r"[0-9a-f]{64}", audit.get("image_manifest_sha256", "")):
              raise SystemExit("invalid audited image manifest digest")
          audit_path = Path("metadata/audit") / expected_audit_artifact
          if not audit_path.is_file() or audit_path.is_symlink():
              raise SystemExit("backend image audit archive is missing or unsafe")
          audit_hasher = hashlib.sha256()
          with audit_path.open("rb") as audit_file:
              for chunk in iter(lambda: audit_file.read(1024 * 1024), b""):
                  audit_hasher.update(chunk)
          if audit_hasher.hexdigest() != audit["sha256"]:
              raise SystemExit("backend image audit archive digest mismatch")
          image_manifest_hasher = hashlib.sha256()
          with Path("metadata/backend/backend-images.json").open("rb") as image_manifest_file:
              for chunk in iter(lambda: image_manifest_file.read(1024 * 1024), b""):
                  image_manifest_hasher.update(chunk)
          if image_manifest_hasher.hexdigest() != audit["image_manifest_sha256"]:
              raise SystemExit("audited image manifest digest mismatch")
          targets = {image["target"] for image in backend["images"]}
          if targets != expected_targets or len(backend["images"]) != len(expected_targets):
              raise SystemExit("release metadata does not contain the current 15-service topology")
          for image in backend["images"]:
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", image["digest"]):
                  raise SystemExit(f"invalid image digest for {image['target']}")
              if not re.fullmatch(r"[0-9a-f]{64}", image["bundle_sha256"]):
                  raise SystemExit(f"invalid bundle digest for {image['target']}")
              if not re.fullmatch(r"[0-9a-f]{64}", image.get("vcpkg_sbom_sha256", "")):
                  raise SystemExit(f"invalid vcpkg SBOM digest for {image['target']}")
              if image.get("legal_status_sha256") != backend_legal["status_sha256"]:
                  raise SystemExit(f"legal status digest mismatch for {image['target']}")
              if image.get("tag") != f"sha-{source_sha}":
                  raise SystemExit(f"invalid commit image tag for {image['target']}")
          version_tag = (
              os.environ["GITHUB_REF_NAME"]
              if os.environ.get("GITHUB_REF_TYPE") == "tag"
              else None
          )
          images = []
          for image in backend["images"]:
              release_image = dict(image)
              release_image["version_tag"] = version_tag
              images.append(release_image)
          manifest = {
              "schema": "memochat-release-v1",
              "source_sha": source_sha,
              "client": client,
              "backend": backend_archive,
              "legal": backend_legal,
              "backend_image_audit": audit,
              "images": sorted(images, key=lambda item: item["target"]),
          }
          output = Path("release-metadata")
          output.mkdir()
          (output / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata
          path: release-metadata/manifest.json
          if-no-files-found: error
          retention-days: 30

  release-version-preflight:
    name: Reject an existing versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-metadata]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify the GitHub Release does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          response="${RUNNER_TEMP}/memochat-release-preflight.txt"
          api_status=0
          gh api --include \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GH_REPO}/releases/tags/${GITHUB_REF_NAME}" \
            > "$response" 2>&1 || api_status=$?
          http_status="$(
            sed -nE 's/^HTTP\/[^ ]+ ([0-9]{3}).*/\1/p' "$response" | tail -n 1
          )"
          if [[ "$api_status" -eq 0 && "$http_status" == 200 ]]; then
            echo "Release already exists; versioned assets are immutable" >&2
            exit 1
          fi
          if [[ "$http_status" != 404 ]]; then
            cat "$response" >&2
            echo "Unable to prove that the GitHub Release is absent" >&2
            exit 1
          fi

  publish-version-image-tags:
    name: Publish versioned image aliases
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-metadata, release-version-preflight]
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-version-images-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-metadata
          path: metadata

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Alias verified image digests with the release version
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest=metadata/manifest.json
          version_tag="$GITHUB_REF_NAME"
          expected_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/memochat/"
          [[ "$(jq -r '.schema' "$manifest")" == memochat-release-v1 ]]
          [[ "$(jq -r '.source_sha' "$manifest")" == "$GITHUB_SHA" ]]
          jq -e --arg source_sha "$GITHUB_SHA" '
            .legal.release_source_sha == $source_sha and
            .legal.formal_distribution_ready == true and
            .legal.third_party_legal_corpus == "complete" and
            (.legal.corpus_sha256 | test("^[0-9a-f]{64}$")) and
            (.legal.status_sha256 | test("^[0-9a-f]{64}$"))
          ' "$manifest" >/dev/null
          [[ "$(jq '.images | length' "$manifest")" -eq 15 ]]
          alias_plan="${RUNNER_TEMP}/memochat-version-aliases.tsv"
          jq -r \
            '.images[] | [.image, .digest, .version_tag, .tag] | @tsv' \
            "$manifest" > "$alias_plan"
          if [[ "$(cut -f 1 "$alias_plan" | LC_ALL=C sort -u | wc -l)" -ne 15 ]]; then
            echo "Version image alias target set is incomplete or duplicated" >&2
            exit 1
          fi

          inspect_digest() {
            local reference="$1"
            local output
            if output="$(
              docker buildx imagetools inspect "$reference" \
                --format '{{.Manifest.Digest}}' 2>&1
            )"; then
              if [[ ! "$output" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "Registry returned an invalid digest for ${reference}" >&2
                return 2
              fi
              printf '%s\n' "$output"
              return 0
            fi
            if [[ "$output" == *"not found"* || "$output" == *"manifest unknown"* ]]; then
              return 1
            fi
            printf '%s\n' "$output" >&2
            return 2
          }

          while IFS=$'\t' read -r image digest manifest_version_tag source_tag; do
            [[ "$image" == "$expected_prefix"* ]]
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$manifest_version_tag" == "$version_tag" ]]
            [[ "$source_tag" == "sha-${GITHUB_SHA}" ]]
            reference="${image}:${version_tag}"
            inspect_status=0
            remote_digest="$(inspect_digest "$reference")" || inspect_status=$?
            if [[ "$inspect_status" -eq 0 ]]; then
              if [[ "$remote_digest" != "$digest" ]]; then
                echo "Version image alias digest mismatch: ${reference}" >&2
                exit 1
              fi
            elif [[ "$inspect_status" -eq 1 ]]; then
              docker buildx imagetools create \
                --tag "$reference" \
                "${image}@${digest}"
              remote_digest="$(inspect_digest "$reference")"
              if [[ "$remote_digest" != "$digest" ]]; then
                echo "Version image alias digest mismatch: ${reference}" >&2
                exit 1
              fi
            else
              exit "$inspect_status"
            fi
          done < "$alias_plan"

          while IFS=$'\t' read -r image digest manifest_version_tag source_tag; do
            reference="${image}:${version_tag}"
            remote_digest="$(inspect_digest "$reference")"
            if [[ "$remote_digest" != "$digest" ]]; then
              echo "Version image alias digest mismatch: ${reference}" >&2
              exit 1
            fi
          done < "$alias_plan"

  publish-github-release:
    name: Publish GitHub release archives
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux-client
      - build-linux-backend
      - release-metadata
      - attest-release-artifacts
      - audit-backend-images
      - publish-version-image-tags
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux client archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-client-release
          path: release-assets/client

      - name: Download backend archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-backend-release
          path: release-assets/backend

      - name: Download release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-metadata
          path: release-assets/metadata

      - name: Download backend image audit evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-image-audit
          path: release-assets/audit

      - name: Verify release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd release-assets/client
            sha256sum --check --strict ./*.sha256
          )
          (
            cd release-assets/backend
            sha256sum --check --strict ./*.sha256
          )
          (
            cd release-assets/audit
            sha256sum --check --strict ./*.tar.gz.sha256
          )
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(
              Path("release-assets/metadata/manifest.json").read_text(encoding="utf-8")
          )
          if manifest.get("schema") != "memochat-release-v1":
              raise SystemExit("unsupported release manifest schema")
          if manifest.get("source_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("release manifest source SHA mismatch")
          legal = manifest.get("legal", {})
          if (
              legal.get("release_source_sha") != os.environ["GITHUB_SHA"]
              or legal.get("formal_distribution_ready") is not True
              or legal.get("third_party_legal_corpus") != "complete"
              or not re.fullmatch(r"[0-9a-f]{64}", legal.get("corpus_sha256", ""))
              or not re.fullmatch(r"[0-9a-f]{64}", legal.get("status_sha256", ""))
          ):
              raise SystemExit("release manifest legal summary is not formal or source-bound")
          client = manifest.get("client", {})
          expected_client_artifact = (
              f"MemoChatQml-{os.environ['GITHUB_SHA'][:12]}-linux-x86_64.tar.gz"
          )
          if client.get("artifact") != expected_client_artifact:
              raise SystemExit("release manifest client artifact mismatch")
          expected_client_sha256 = client.get("sha256", "")
          if not re.fullmatch(r"[0-9a-f]{64}", expected_client_sha256):
              raise SystemExit("release manifest client digest is invalid")
          client_path = Path("release-assets/client") / expected_client_artifact
          if not client_path.is_file() or client_path.is_symlink():
              raise SystemExit("release manifest client archive is missing or unsafe")
          client_hasher = hashlib.sha256()
          with client_path.open("rb") as client_file:
              for chunk in iter(lambda: client_file.read(1024 * 1024), b""):
                  client_hasher.update(chunk)
          if client_hasher.hexdigest() != expected_client_sha256:
              raise SystemExit("release manifest client archive digest mismatch")
          backend = manifest.get("backend", {})
          expected_backend_artifact = (
              f"MemoChat-backend-{os.environ['GITHUB_SHA'][:12]}-linux-x86_64.tar.gz"
          )
          if backend.get("artifact") != expected_backend_artifact:
              raise SystemExit("release manifest backend artifact mismatch")
          expected_backend_sha256 = backend.get("sha256", "")
          if not re.fullmatch(r"[0-9a-f]{64}", expected_backend_sha256):
              raise SystemExit("release manifest backend digest is invalid")
          backend_path = Path("release-assets/backend") / expected_backend_artifact
          if not backend_path.is_file() or backend_path.is_symlink():
              raise SystemExit("release manifest backend archive is missing or unsafe")
          backend_hasher = hashlib.sha256()
          with backend_path.open("rb") as backend_file:
              for chunk in iter(lambda: backend_file.read(1024 * 1024), b""):
                  backend_hasher.update(chunk)
          if backend_hasher.hexdigest() != expected_backend_sha256:
              raise SystemExit("release manifest backend archive digest mismatch")
          audit = manifest.get("backend_image_audit", {})
          expected_audit_artifact = (
              f"backend-image-audit-{os.environ['GITHUB_SHA'][:12]}.tar.gz"
          )
          if (
              audit.get("schema") != "memochat-backend-image-audit-artifact-v1"
              or audit.get("source_sha") != os.environ["GITHUB_SHA"]
              or audit.get("artifact") != expected_audit_artifact
              or not re.fullmatch(r"[0-9a-f]{64}", audit.get("image_manifest_sha256", ""))
          ):
              raise SystemExit("release manifest backend image audit artifact mismatch")
          expected_audit_sha256 = audit.get("sha256", "")
          if not re.fullmatch(r"[0-9a-f]{64}", expected_audit_sha256):
              raise SystemExit("release manifest backend image audit digest is invalid")
          audit_path = Path("release-assets/audit") / expected_audit_artifact
          if not audit_path.is_file() or audit_path.is_symlink():
              raise SystemExit("release manifest backend image audit archive is missing or unsafe")
          audit_hasher = hashlib.sha256()
          with audit_path.open("rb") as audit_file:
              for chunk in iter(lambda: audit_file.read(1024 * 1024), b""):
                  audit_hasher.update(chunk)
          if audit_hasher.hexdigest() != expected_audit_sha256:
              raise SystemExit("release manifest backend image audit digest mismatch")
          version_tag = os.environ["GITHUB_REF_NAME"]
          if len(manifest.get("images", [])) != 15 or any(
              image.get("version_tag") != version_tag for image in manifest.get("images", [])
          ):
              raise SystemExit("release manifest version tags are incomplete")
          if any(
              not re.fullmatch(r"[0-9a-f]{64}", image.get("bundle_sha256", ""))
              for image in manifest["images"]
          ):
              raise SystemExit("release manifest bundle digests are incomplete")
          if any(
              not re.fullmatch(r"[0-9a-f]{64}", image.get("vcpkg_sbom_sha256", ""))
              or image.get("legal_status_sha256") != legal["status_sha256"]
              for image in manifest["images"]
          ):
              raise SystemExit("release manifest SBOM/legal bindings are incomplete")
          PY

      - name: Create immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          mapfile -d '' assets < <(
            find release-assets -type f \
              \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' -o -name 'manifest.json' \) \
              -print0 | sort -z
          )
          [[ "${#assets[@]}" -eq 7 ]]
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; versioned assets are immutable" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${assets[@]}"
