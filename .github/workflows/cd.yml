name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]

permissions:
  actions: read
  contents: read

concurrency:
  group: promote-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  promote-images:
    name: Promote verified GHCR images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Download CI release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-metadata --dir incoming

      - name: Validate immutable release manifest
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path("incoming/manifest.json").read_text(encoding="utf-8"))
          expected_images = {
              "AIGatewayServer": "ai-gateway",
              "AIServer": "ai-server",
              "AccountServer": "account-server",
              "CallGatewayServer": "call-gateway",
              "ChatDeliveryWorker": "chat-delivery-worker",
              "ChatMessageService": "chat-message-service",
              "ChatRelationQueryService": "chat-relation-query-service",
              "ChatRelationServiceWorker": "chat-relation-service-worker",
              "ChatServer": "chat-server",
              "LoginServer": "login-server",
              "MediaGatewayServer": "media-gateway",
              "MomentsGatewayServer": "moments-gateway",
              "R18GatewayServer": "r18-gateway",
              "RegisterServer": "register-server",
              "VarifyServer": "varify-server",
          }
          if manifest.get("schema") != "memochat-release-v1":
              raise SystemExit("unsupported release metadata schema")
          if manifest.get("source_sha") != os.environ["EXPECTED_SHA"]:
              raise SystemExit("release metadata does not belong to the triggering commit")
          images = manifest.get("images", [])
          if len(images) != 15 or {item.get("target") for item in images} != set(expected_images):
              raise SystemExit("release metadata does not contain the current service topology")
          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          prefix = f"ghcr.io/{owner}/memochat/"
          for item in images:
              expected_image = prefix + expected_images[item["target"]]
              if item.get("image") != expected_image:
                  raise SystemExit(f"unexpected registry path: {item.get('image')}")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", item.get("digest", "")):
                  raise SystemExit(f"invalid digest for {item.get('target')}")
              if not re.fullmatch(r"[0-9a-f]{64}", item.get("bundle_sha256", "")):
                  raise SystemExit(f"invalid bundle digest for {item.get('target')}")
          channel = "stable" if os.environ["EXPECTED_BRANCH"] == "main" else "dev"
          with Path("promote.tsv").open("w", encoding="utf-8") as output:
              for item in images:
                  output.write(f"{item['image']}\t{item['digest']}\t{channel}\n")
          PY

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Promote digests without rebuilding
        run: |
          set -Eeuo pipefail
          while IFS=$'\t' read -r image digest channel; do
            docker buildx imagetools create \
              --tag "${image}:${channel}" \
              "${image}@${digest}"
          done < promote.tsv
